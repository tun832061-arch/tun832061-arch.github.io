<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Anton"; src: url("fonts/Anton-Regular.ttf"); }
@font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf"); font-weight: 100 900; }
html, body { margin: 0; background: #000; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Behind the Frame — talking-head edit. #raw renders the same cuts with no edit (for the before/after).
const RAW = location.hash === "#raw", W = 1080, H = 1920, FPS = 30, NAME = "Tun";
const cv = document.getElementById("c"), cx = cv.getContext("2d");
const ACC = "#ff4d2e", INK = "#f3f1ec", BG = "#0c0c0e";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k, inv = (a, b, x) => clamp((x - a) / (b - a));
const eout = (k) => 1 - Math.pow(1 - k, 3), eio = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const back = (k) => { const c1 = 1.7, c3 = c1 + 1; return k <= 0 ? 0 : 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
// segments: [clip, in, out, zoom, focusY]
const SEG = [["c2", 0.15, 2.75, 1.0, 0.36], ["c2", 3.15, 7.95, 1.14, 0.33], ["c3", 1.10, 7.40, 1.0, 0.36], ["c1", 0.35, 4.15, 1.1, 0.34], ["c1", 4.42, 6.60, 1.24, 0.32]];
let acc = 0; const SEGT = SEG.map((s) => { const r = { s, t0: acc, t1: acc + (s[2] - s[1]) }; acc = r.t1; return r; });
const TALK_END = acc, END = TALK_END + 3.0;
const map = (clip, t) => { const r = SEGT.find((r) => r.s[0] === clip && t >= r.s[1] && t <= r.s[2]); return r ? r.t0 + (t - r.s[1]) : null; };
// captions: [clip, words(start index), text, highlight]
const WD = {
  c2: [["hi",0.26],["i'm",0.75],["ton",0.99],["i'm",1.58],["a",1.70],["motion",1.74],["designer",2.12],["i",3.23],["design",3.33],["animate",4.12],["and",4.77],["score",4.92],["short",5.33],["films",5.64],["for",6.08],["brands",6.23],["and",6.98],["apps",7.17]],
  c3: [["every",1.23],["project",1.51],["starts",1.88],["with",2.28],["a",2.41],["brief",2.50],["and",2.99],["still",3.21],["frames",3.51],["so",4.31],["you",4.44],["can",4.55],["see",4.72],["where",4.99],["it's",5.24],["going",5.41],["before",5.86],["anything",6.28],["moves",6.68]],
  c1: [["if",0.47],["you've",0.58],["got",0.71],["something",0.88],["to",1.32],["launch",1.44],["or",1.97],["explain",2.15],["send",3.06],["me",3.36],["a",3.48],["message",3.52],["let's",4.48],["make",4.70],["it",4.89],["move",4.98]],
};
const CAP = [ // clip, first word index, last word index, display text with *highlight*
  ["c2", 0, 2, `Hi, I'm ${NAME}.`], ["c2", 3, 6, "I'm a *motion designer.*"], ["c2", 7, 11, "I design, animate and score"], ["c2", 12, 14, "short films"], ["c2", 15, 17, "for *brands* and *apps.*"],
  ["c3", 0, 2, "Every project starts"], ["c3", 3, 5, "with a *brief*"], ["c3", 6, 8, "and *still frames,*"], ["c3", 9, 15, "so you can see where it's going"], ["c3", 16, 18, "before anything *moves.*"],
  ["c1", 0, 4, "If you've got something to"], ["c1", 5, 7, "*launch* or *explain,*"], ["c1", 8, 11, "send me a message."], ["c1", 12, 15, "Let's make it *move.*"],
].map(([c, a, b, txt]) => ({ t0: map(c, WD[c][a][1] - 0.05), t1: b + 1 < WD[c].length ? map(c, WD[c][b + 1][1] - 0.05) : null, txt })).map((c, i, arr) => ({ ...c, t1: c.t1 ?? (arr[i + 1] ? arr[i + 1].t0 : TALK_END) }));
CAP.forEach((c, i) => { if (CAP[i + 1] && CAP[i + 1].t0 < c.t1) c.t1 = CAP[i + 1].t0; if (c.t0 == null) c.t0 = i ? CAP[i - 1].t1 : 0; });
// cut-away cards: [time, image, label, side]
const CARDS = [[map("c2", 6.23), "kk", "Kettle & Kiln", -1], [map("c2", 7.17), "kairo", "Kairo", 1], [map("c3", 2.50), "brief", "The brief, written down", -1], [map("c3", 3.21), "lw", "Styleframe · The Last Watch", 1],
  [map("c1", 1.44), "kicks", "Kicks Drop", -1], [map("c1", 2.15), "splitly", "Splitly", 1]];
const BROLL = [map("c3", 5.86), map("c3", 7.30) - 0.02]; // full-screen Say It Slower burst
// ---------- image cache
const cache = new Map(); const load = (p) => { if (!cache.has(p)) { const im = new Image(); im.src = p; cache.set(p, im.decode().then(() => im)); } return cache.get(p); };
const frameOf = (clip, t) => `frames/${clip}/f${String(clamp(Math.round(t * FPS), 0, 239) + 1).padStart(5, "0")}.jpg`;
function rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect(x, y, w, h, r); }
async function talking(t) {
  const r = SEGT.find((r) => t >= r.t0 && t < r.t1) || SEGT[SEGT.length - 1]; const [clip, tin, , zoom, fy] = r.s, ct = tin + (t - r.t0);
  const im = await load(frameOf(clip, ct)); const z = RAW ? 1 : zoom * (1 + 0.012 * Math.sin(t * 0.7));
  cx.save(); if (!RAW) cx.filter = "contrast(1.07) saturate(1.06) brightness(1.02)";
  cx.translate(W / 2, H * fy); cx.scale(z, z); cx.translate(-W / 2, -H * fy); cx.drawImage(im, 0, 0, W, H); cx.restore();
  if (!RAW) { const g = cx.createRadialGradient(W / 2, H * 0.42, H * 0.3, W / 2, H / 2, H * 0.78); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.35)"); cx.fillStyle = g; cx.fillRect(0, 0, W, H); }
}
function caption(t) {
  const c = CAP.find((c) => t >= c.t0 && t < c.t1); if (!c) return;
  const k = back(inv(c.t0, c.t0 + 0.22, t)), parts = c.txt.split("*");
  cx.save(); cx.font = "900 78px Inter"; cx.textBaseline = "middle"; cx.lineJoin = "round";
  const words = []; parts.forEach((p, i) => p.split(" ").filter(Boolean).forEach((w) => words.push([w, i % 2 === 1])));
  const lines = [[]]; let lw = 0; const maxW = W * 0.84, sp = cx.measureText(" ").width;
  for (const [w, h] of words) { const ww = cx.measureText(w).width; if (lw + ww > maxW && lines[lines.length - 1].length) { lines.push([]); lw = 0; } lines[lines.length - 1].push([w, h, ww]); lw += ww + sp; }
  const y0 = 1380 - (lines.length - 1) * 46;
  cx.translate(W / 2, y0); cx.scale(lerp(0.85, 1, k), lerp(0.85, 1, k)); cx.translate(-W / 2, -y0);
  lines.forEach((ln, li) => { const tw = ln.reduce((a, [, , w]) => a + w, 0) + sp * (ln.length - 1); let x = (W - tw) / 2; const y = y0 + li * 92;
    for (const [w, h, ww] of ln) { cx.lineWidth = 14; cx.strokeStyle = "rgba(0,0,0,0.85)"; cx.strokeText(w, x, y); cx.fillStyle = h ? ACC : INK; cx.fillText(w, x, y); x += ww + sp; } });
  cx.restore();
}
function lowerThird(t) {
  const k = eout(inv(0.5, 0.95, t)) * (1 - eout(inv(2.9, 3.3, t))); if (k <= 0) return;
  cx.save(); cx.globalAlpha = k; const x = 70 - (1 - k) * 60, y = 300;
  cx.fillStyle = ACC; cx.fillRect(x, y, 8, 118);
  cx.font = "400 76px Anton"; cx.fillStyle = INK; cx.textBaseline = "top"; cx.shadowColor = "rgba(0,0,0,.6)"; cx.shadowBlur = 18; cx.fillText(NAME.toUpperCase(), x + 30, y - 4);
  cx.font = "700 30px Inter"; cx.letterSpacing = "6px"; cx.fillText("MOTION DESIGNER", x + 32, y + 82); cx.restore();
}
async function cards(t) {
  for (const [t0, img, label, side] of CARDS) {
    const k = back(inv(t0, t0 + 0.3, t)), out = eout(inv(t0 + 0.95, t0 + 1.2, t)); if (t < t0 || out >= 1) continue;
    const im = await load(`img/${img}.jpg`), tall = im.height > im.width, w = tall ? 300 : 480, h = w * im.height / im.width, x = side < 0 ? 46 : W - 46 - w, y = tall ? 250 : 70;
    cx.save(); cx.globalAlpha = 1 - out; cx.translate(x + w / 2, y + h / 2); cx.rotate(side * 0.035); cx.scale(lerp(0.6, 1, k), lerp(0.6, 1, k)); cx.translate(-w / 2 + side * out * 200, -h / 2);
    cx.shadowColor = "rgba(0,0,0,0.5)"; cx.shadowBlur = 40; cx.shadowOffsetY = 16; rr(0, 0, w, h, 26); cx.fillStyle = "#000"; cx.fill(); cx.shadowColor = "transparent";
    cx.save(); rr(0, 0, w, h, 26); cx.clip(); cx.drawImage(im, 0, 0, w, h); cx.restore();
    cx.lineWidth = 4; cx.strokeStyle = "rgba(255,255,255,0.9)"; rr(0, 0, w, h, 26); cx.stroke();
    cx.font = "800 24px Inter"; const lw = cx.measureText(label).width + 40; rr(14, h - 60, lw, 46, 23); cx.fillStyle = "rgba(12,12,14,0.85)"; cx.fill(); cx.fillStyle = INK; cx.textBaseline = "middle"; cx.fillText(label, 34, h - 37);
    cx.restore();
  }
}
async function broll(t) {
  if (t < BROLL[0] || t >= BROLL[1]) return false;
  const im = await load(`frames/ss/f${String(clamp(Math.round((t - BROLL[0]) * FPS), 0, 44) + 1).padStart(5, "0")}.jpg`); cx.drawImage(im, 0, 0, W, H);
  cx.font = "800 28px Inter"; const label = "Say It Slower", lw = cx.measureText(label).width + 40; rr(70, 230, lw, 48, 24); cx.fillStyle = "rgba(12,12,14,0.85)"; cx.fill(); cx.fillStyle = INK; cx.textBaseline = "middle"; cx.fillText(label, 90, 254);
  return true;
}
function endCard(t) {
  const k = eio(inv(TALK_END, TALK_END + 0.45, t)); cx.save(); cx.beginPath(); cx.arc(W / 2, H * 0.4, 2400 * k, 0, 6.29); cx.clip(); cx.fillStyle = BG; cx.fillRect(0, 0, W, H);
  const a = (d) => eout(inv(TALK_END + d, TALK_END + d + 0.4, t)); cx.textAlign = "left"; cx.textBaseline = "alphabetic";
  cx.font = "400 210px Anton"; const wN = cx.measureText("CLOWN").width, wD = cx.measureText(".").width, x = (W - wN - wD) / 2;
  cx.globalAlpha = a(0.2); cx.fillStyle = INK; cx.fillText("CLOWN", x, 900 + (1 - a(0.2)) * 30); cx.fillStyle = ACC; cx.fillText(".", x + wN, 900);
  cx.textAlign = "center"; cx.globalAlpha = a(0.45); cx.font = "600 34px Inter"; cx.letterSpacing = "8px"; cx.fillStyle = "#a9a59d"; cx.fillText("MOTION DESIGNER", W / 2 + 4, 990); cx.letterSpacing = "0px";
  cx.globalAlpha = a(0.7); cx.font = "700 44px Inter"; cx.fillStyle = ACC; cx.fillText("tun832061@gmail.com", W / 2, 1110); cx.restore();
}
window.DUR = END;
window.render = async (f) => {
  if (cx.reset) cx.reset(); const t = f / FPS;
  if (RAW) { if (t < TALK_END) await talking(t); else { cx.fillStyle = "#000"; cx.fillRect(0, 0, W, H); } return; }
  if (t < TALK_END + 0.5) { if (!(await broll(t))) { await talking(t); await cards(t); } lowerThird(t); caption(t); }
  if (t >= TALK_END) endCard(t);
};
window.ready = document.fonts.ready.then(() => Promise.all([document.fonts.load("900 40px Inter"), document.fonts.load("40px Anton"), document.fonts.load("700 40px Inter")]));
</script></body></html>
