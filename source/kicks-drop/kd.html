<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Anton"; src: url("fonts/Anton-Regular.ttf"); }
@font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf"); font-weight: 100 900; }
html, body { margin: 0; background: #000; }
</style></head>
<body><canvas id="c"></canvas>
<script>
// Kicks Drop — three 9:16 ads (#a hook 6 s, #b product 15 s, #c offer 10 s) and #as (the hook re-composed 1:1).
const MODE = (location.hash || "#a").slice(1), SQ = MODE === "as", W = 1080, H = SQ ? 1080 : 1920, FPS = 30;
const cv = document.getElementById("c"); cv.width = W; cv.height = H; const cx = cv.getContext("2d");
const BK = "#111111", LIME = "#d4ff3a", CORAL = "#ff5a36", CREAM = "#f5efe4", GREY = "#2a2a2a", MUT = "#8c8c8c";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k, inv = (a, b, x) => clamp((x - a) / (b - a));
const eout = (k) => 1 - Math.pow(1 - k, 3), eout5 = (k) => 1 - Math.pow(1 - k, 5), eio = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const back = (k) => { const c1 = 1.8, c3 = c1 + 1; return k <= 0 ? 0 : 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rr(x, y, w, h, r, f) { cx.beginPath(); cx.roundRect(x, y, w, h, r); if (f) { cx.fillStyle = f; cx.fill(); } }
function T(s, x, y, size, color = CREAM, align = "center", font = "Anton", weight = 400, ls = 0) { cx.font = `${weight} ${size}px ${font}`; cx.fillStyle = color; cx.textAlign = align; cx.textBaseline = "middle"; cx.letterSpacing = ls + "px"; cx.fillText(s, x, y); cx.letterSpacing = "0px"; }
function fitSize(s, size, maxW, font = "Anton", weight = 400) { cx.font = `${weight} ${size}px ${font}`; const w = cx.measureText(s).width; return w > maxW ? size * maxW / w : size; }
const SAFE = { top: SQ ? 80 : 260, bottom: SQ ? 1000 : 1460, left: 80, right: SQ ? 1000 : 920 };   // clear of the Reels / TikTok UI

// ---------- the sneaker: side view, toe to the right, origin at the middle of the sole
const SHOE = new Image(); SHOE.src = "photo/shoe.png";
const SHOP = document.createElement("canvas"), sx2 = SHOP.getContext("2d");
function sneaker(x, y, s, opt = {}) { // the photographed pair (Pexels), cut out; bottom-centre at (x, y)
  const k = 0.7 * s, w = 1147 * k, h = 1055 * k, sx = (opt.sx ?? 1) * (opt.flip ?? 1);
  cx.save(); cx.translate(x, y); cx.globalAlpha = 0.45; cx.beginPath(); cx.ellipse(0, 26 * s, w * 0.42 * Math.abs(sx), 26 * s, 0, 0, 6.29); cx.fillStyle = "#000"; cx.fill(); cx.globalAlpha = 1;
  cx.rotate(opt.rot || 0); cx.scale(sx, 1);
  if (opt.sweep != null) { SHOP.width = Math.ceil(w); SHOP.height = Math.ceil(h); sx2.clearRect(0, 0, w, h); sx2.globalCompositeOperation = "source-over"; sx2.drawImage(SHOE, 0, 0, w, h);
    sx2.globalCompositeOperation = "source-atop"; const px = lerp(-0.3, 1.3, opt.sweep) * w, g = sx2.createLinearGradient(px - 160, 0, px + 160, 0); g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, "rgba(255,255,255,0.55)"); g.addColorStop(1, "rgba(255,255,255,0)"); sx2.fillStyle = g; sx2.fillRect(0, 0, w, h);
    cx.drawImage(SHOP, -w / 2, -h); }
  else cx.drawImage(SHOE, -w / 2, -h, w, h);
  cx.restore();
}
function sneakerFront(x, y, s) { // toe-on view for the spin
  cx.save(); cx.translate(x, y); cx.scale(s, s);
  rr(-120, -40, 240, 50, 20, "#1c1c1c"); rr(-130, -110, 260, 80, 30, "#ffffff"); cx.fillStyle = CORAL; cx.fillRect(-130, -76, 260, 6);
  cx.beginPath(); cx.moveTo(-120, -110); cx.quadraticCurveTo(-140, -300, -40, -420); cx.lineTo(40, -420); cx.quadraticCurveTo(140, -300, 120, -110); cx.closePath(); cx.fillStyle = CORAL; cx.fill();
  cx.beginPath(); cx.ellipse(0, -140, 110, 60, 0, Math.PI, 0); cx.fillStyle = CREAM; cx.fill();
  cx.strokeStyle = "#fff"; cx.lineWidth = 9; for (let i = 0; i < 4; i++) { cx.beginPath(); cx.moveTo(-40, -340 + i * 40); cx.lineTo(40, -330 + i * 40); cx.stroke(); }
  rr(-50, -470, 100, 60, 18, CREAM); cx.restore();
}
function spin(x, y, s, t, t0, dur = 1.6) { // one photo: a 3D-style turn and tilt, with a light sweep
  const k = clamp((t - t0) / dur), e = eio(k);
  sneaker(x, y, s, { sx: lerp(0.45, 1, back(clamp(k * 1.25))), rot: lerp(-0.32, 0.04, e) + Math.sin(t * 2.2) * 0.015, sweep: k });
}
function logo(x, y, size, color = CREAM) { // KICKS wordmark with the bolt
  cx.save(); cx.translate(x, y); T("KICKS", 0, 0, size, color); cx.font = `400 ${size}px Anton`; const w = cx.measureText("KICKS").width;
  cx.translate(w / 2 + size * 0.28, 0); cx.scale(size / 300, size / 300); cx.beginPath(); [[-60, 40], [10, -100], [0, -20], [70, -40], [0, 100], [10, 20]].forEach(([a, b], i) => (i ? cx.lineTo(a, b) : cx.moveTo(a, b))); cx.closePath(); cx.fillStyle = LIME; cx.fill(); cx.restore();
}
function grid(t) { cx.strokeStyle = "rgba(255,255,255,0.04)"; cx.lineWidth = 2; for (let x = 0; x < W; x += 90) { cx.beginPath(); cx.moveTo(x, 0); cx.lineTo(x, H); cx.stroke(); } for (let y = (t * 40) % 90; y < H; y += 90) { cx.beginPath(); cx.moveTo(0, y); cx.lineTo(W, y); cx.stroke(); } }
function pill(text, x, y, k, fill = LIME, color = BK, size = 40) { if (k <= 0) return; cx.save(); cx.translate(x, y); cx.scale(k, k); cx.font = `800 ${size}px Inter`; const w = cx.measureText(text).width + size * 1.4; rr(-w / 2, -size * 0.95, w, size * 1.9, size * 0.95, fill); T(text, 0, 2, size, color, "center", "Inter", 800); cx.restore(); }

// ================= AD A — HOOK (6 s) =================
function adA(t) {
  cx.fillStyle = BK; cx.fillRect(0, 0, W, H); grid(t);
  const cxm = W / 2, cy = SQ ? 600 : 980;
  // 0–1.4: the shoebox lid slams open toward camera
  if (t < 1.6) {
    const open = eout5(inv(0.25, 0.55, t)), punch = 1 + 0.12 * Math.exp(-Math.max(0, t - 0.55) * 8) * (t > 0.55 ? 1 : 0);
    cx.save(); cx.translate(cxm, cy); cx.scale(punch * (SQ ? 0.8 : 1), punch * (SQ ? 0.8 : 1));
    rr(-420, -40, 840, 380, 18, CORAL); cx.fillStyle = "rgba(0,0,0,0.18)"; cx.fillRect(-420, -40, 840, 40); logo(-60, 160, 120, BK);
    cx.save(); cx.translate(0, -40 - open * 520); const ls = 1 + open * 1.6; cx.scale(ls, ls); cx.rotate(-open * 0.25); cx.globalAlpha = 1 - inv(0.7, 1, open);
    rr(-440, -120, 880, 130, 18, CORAL); cx.fillStyle = "rgba(0,0,0,0.15)"; cx.fillRect(-440, -10, 880, 20); logo(-50, -55, 70, BK); cx.restore();
    if (open > 0.6) { const g = cx.createRadialGradient(0, -60, 0, 0, -60, 600); g.addColorStop(0, `rgba(212,255,58,${0.55 * (1 - inv(0.6, 1.6, t))})`); g.addColorStop(1, "rgba(212,255,58,0)"); cx.fillStyle = g; cx.fillRect(-700, -700, 1400, 1100); }
    cx.restore();
    const hk = eout5(inv(0.55, 0.8, t)); T("NEW COLOURWAY", cxm, SAFE.top + 60, fitSize("NEW COLOURWAY", 110, 900), LIME, "center", "Anton", 400); cx.globalAlpha = 1;
    if (hk < 1) { cx.fillStyle = BK; cx.fillRect(0, SAFE.top - 20, W * (1 - hk), 160); }
  } else if (t < 4.0) { // the shoe rises out of the box and spins: 8 stills
    const rise = eout5(inv(1.6, 1.9, t));
    spin(cxm, SQ ? 1000 - rise * 60 : cy + 330 - rise * 80, SQ ? 0.62 : 1.0, t, 1.9, 1.9);
    T("WAVE RUNNER", cxm, SAFE.top + 60, fitSize("WAVE RUNNER", 140, 900), CREAM); T("CLOUD WHITE", cxm, SAFE.top + 160, 34, LIME, "center", "Inter", 800, 8);
  } else { // end: drops Friday + date
    sneaker(cxm + 20, SQ ? 870 : cy + 310, SQ ? 0.62 : 1.0, { rot: -0.08 + Math.sin(t * 2) * 0.02, sweep: inv(4.2, 5.4, t) });
    const k = back(inv(4.0, 4.35, t)), k2 = back(inv(4.3, 4.65, t));
    cx.save(); cx.translate(cxm, SAFE.top + 90); cx.scale(k, k); T("DROPS FRIDAY", 0, 0, fitSize("DROPS FRIDAY", 160, 920), LIME); cx.restore();
    pill("FRI 10 AM · ONLINE ONLY", SQ ? cxm + 150 : cxm, SQ ? 960 : SAFE.bottom - 40, k2, CREAM, BK, SQ ? 32 : 40);
    logo(SQ ? 180 : cxm - 40, SQ ? 960 : SAFE.top + 230, 64, CREAM);
  }
  const fl = 1 - inv(0.55, 0.75, t); if (t > 0.55 && fl > 0) { cx.fillStyle = `rgba(255,255,255,${0.6 * fl})`; cx.fillRect(0, 0, W, H); }
}
// ================= AD B — PRODUCT (15 s) =================
function adB(t) {
  cx.fillStyle = BK; cx.fillRect(0, 0, W, H); grid(t);
  const cy = 1290;
  if (t < 1.8) { // hook
    const lines = ["3 REASONS", "THESE SOLD", "OUT LAST TIME"]; lines.forEach((l, i) => { const k = eout5(inv(0.05 + i * 0.18, 0.35 + i * 0.18, t)); T(l, W / 2 + (1 - k) * (i % 2 ? 1 : -1) * W, 700 + i * 170, fitSize(l, 190, 900), i === 0 ? LIME : CREAM); });
    return;
  }
  const R = [[1.8, "01", "CLOUD FOAM SOLE", "A chunky sole. All-day soft.", [18.6, -80.5], [0, 0], 1.7], [5.2, "02", "LOOP LACES", "Lace loops that lock your heel in.", [-79.5, -374.5], [0, 0], 1.9], [8.6, "03", "WAVE PANELS", "Reflective trim over breathable mesh.", [-65.5, -234.5], [0, 0], 1.8]];
  let ri = R.length - 1; while (ri > 0 && t < R[ri][0]) ri--; const [t0, num, head, sub, anchor, lab, zoom] = R[ri];
  if (t < 12) {
    const zk = eio(inv(t0, t0 + 0.5, t)) * (1 - eio(inv(t0 + 2.9, t0 + 3.4, t))), z = lerp(1, zoom, zk), s = 0.95;
    cx.save(); cx.translate(W / 2, cy); cx.scale(z, z); cx.translate(-anchor[0] * s * zk, -anchor[1] * s * zk); sneaker(0, 0, s);
    // callout: dot on the part + line to the label
    const lk = eout(inv(t0 + 0.4, t0 + 0.8, t)); const ax = anchor[0] * s, ay = anchor[1] * s, lx = ax + lab[0], ly = ay + lab[1];
    cx.beginPath(); cx.arc(ax, ay, 14 / z * back(inv(t0 + 0.3, t0 + 0.6, t)), 0, 6.29); cx.fillStyle = LIME; cx.fill(); cx.restore();
    const sxp = W / 2 + z * ax * (1 - zk), syp = cy + z * ay * (1 - zk), ex = 130, ey = SAFE.top + 320;
    cx.strokeStyle = LIME; cx.lineWidth = 5; cx.beginPath(); cx.moveTo(sxp, syp); cx.lineTo(lerp(sxp, ex + 40, lk), lerp(syp, ey + 60, lk)); cx.lineTo(lerp(sxp, ex, lk), lerp(syp, ey + 60, lk)); cx.stroke();
    const ck = eout5(inv(t0 + 0.6, t0 + 0.9, t)), out = inv(t0 + 3.1, t0 + 3.4, t);
    const shade = cx.createLinearGradient(0, 0, 0, SAFE.top + 420); shade.addColorStop(0, "rgba(17,17,17,0.97)"); shade.addColorStop(0.75, "rgba(17,17,17,0.85)"); shade.addColorStop(1, "rgba(17,17,17,0)"); cx.fillStyle = shade; cx.fillRect(0, 0, W, SAFE.top + 420);
    cx.save(); cx.globalAlpha = ck * (1 - out); cx.translate(0, (1 - ck) * 40);
    T(num, 110, SAFE.top + 40, 120, LIME, "left"); T(head, 110, SAFE.top + 170, fitSize(head, 110, 820), CREAM, "left"); T(sub, 112, SAFE.top + 260, 40, MUT, "left", "Inter", 600); cx.restore();
    // progress: 3 dots
    [0, 1, 2].forEach((d) => { rr(W / 2 - 75 + d * 60, SAFE.bottom - 10, 34, 10, 5, d <= ri ? LIME : GREY); });
    return;
  }
  // end: logo + shop now
  const k = eout5(inv(12, 12.4, t)); sneaker(W / 2, 1290, 1.0 * lerp(1.12, 1, k), { rot: -0.06, sweep: inv(12.2, 13.6, t) }); logo(W / 2 - 60, SAFE.top + 80, 140, CREAM);
  T("WAVE RUNNER · $120", W / 2, SAFE.top + 220, 44, MUT, "center", "Inter", 700, 4);
  const pulse = 1 + 0.05 * Math.sin((t - 12.6) * 8) * (t > 12.6 ? 1 : 0); pill("SHOP NOW →", W / 2, SAFE.bottom - 60, back(inv(12.5, 12.9, t)) * pulse, LIME, BK, 54);
}
// ================= AD C — OFFER (10 s) =================
function adC(t) {
  cx.fillStyle = t < 1.8 ? LIME : BK; cx.fillRect(0, 0, W, H); if (t >= 1.8) grid(t);
  if (t < 1.8) { const k = eout5(inv(0.05, 0.25, t)), shake = Math.sin(t * 80) * 18 * Math.exp(-(t - 0.25) * 6) * (t > 0.25 ? 1 : 0);
    cx.save(); cx.translate(W / 2 + shake, H / 2 - 80); cx.scale(lerp(3, 1, k), lerp(3, 1, k)); cx.rotate(-0.08); T("−20%", 0, 0, 380, BK); cx.restore();
    T("THIS WEEKEND ONLY", W / 2, H / 2 + 220, 64, BK, "center", "Anton", 400, 4); return; }
  sneaker(W / 2, 1240, 0.95, { rot: -0.06 });
  // price slash: old -> new
  const sk = eio(inv(2.2, 2.6, t)), nk = back(inv(2.6, 2.95, t));
  T("$120", W / 2 - 170, SAFE.top + 120, 150, sk > 0 ? MUT : CREAM); if (sk > 0) { cx.strokeStyle = CORAL; cx.lineWidth = 14; cx.beginPath(); cx.moveTo(W / 2 - 300, SAFE.top + 150); cx.lineTo(W / 2 - 300 + 260 * sk, SAFE.top + 90); cx.stroke(); }
  if (nk > 0) { cx.save(); cx.translate(W / 2 + 190, SAFE.top + 120); cx.scale(nk, nk); T("$96", 0, 0, 190, LIME); cx.restore(); }
  // countdown ticks
  const ck = eout(inv(3.2, 3.5, t)); if (ck > 0) { const left = 47 * 3600 + 59 * 60 + 59 - Math.floor(Math.max(0, t - 3.5)); const hh = String(Math.floor(left / 3600)).padStart(2, "0"), mm = String(Math.floor(left / 60) % 60).padStart(2, "0"), ss = String(left % 60).padStart(2, "0");
    cx.globalAlpha = ck; T("ENDS IN", W / 2, 1300, 36, MUT, "center", "Inter", 700, 8); [hh, mm, ss].forEach((v, i) => { rr(W / 2 - 330 + i * 230, 1340, 200, 150, 20, GREY); T(v, W / 2 - 230 + i * 230, 1418, 110, i === 2 ? LIME : CREAM); }); cx.globalAlpha = 1; }
  if (t >= 7) { const k = back(inv(7, 7.35, t)), k2 = eout(inv(7.4, 7.8, t)); cx.fillStyle = `rgba(17,17,17,${0.85 * eout(inv(7, 7.3, t))})`; cx.fillRect(0, 0, W, H);
    cx.save(); cx.translate(W / 2, 820); cx.scale(k, k); T("CODE", 0, -150, 70, MUT, "center", "Anton", 400, 10); rr(-400, -80, 800, 200, 28, LIME); T("KICKS20", 0, 22, 150, BK); cx.restore();
    cx.globalAlpha = k2; logo(W / 2 - 50, 1180, 100, CREAM); T("@kicks.official", W / 2, 1300, 44, MUT, "center", "Inter", 700); cx.globalAlpha = 1; }
}
const AD = { a: [adA, 6], b: [adB, 15], c: [adC, 10], as: [adA, 6] }[MODE];
window.DUR = AD[1];
window.render = (f) => { if (cx.reset) cx.reset(); const t = f / FPS; AD[0](t); const out = inv(AD[1] - 0.25, AD[1], t); if (out > 0) { cx.fillStyle = `rgba(0,0,0,${out})`; cx.fillRect(0, 0, W, H); } };
window.ready = document.fonts.ready.then(() => Promise.all([SHOE.decode(), document.fonts.load("40px Anton"), document.fonts.load("800 40px Inter"), document.fonts.load("600 40px Inter")]));
</script></body></html>
