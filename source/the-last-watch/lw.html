<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "CG"; src: url("fonts/f2.ttf"); font-weight: 600; }
@font-face { font-family: "CG"; src: url("fonts/f1.ttf"); font-weight: 500; }
@font-face { font-family: "CSC"; src: url("fonts/f3.ttf"); font-weight: 600; }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// The Last Watch — 50 s title sequence. render(t) draws one frame; everything is a function of time.
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById("c"), cx = cv.getContext("2d");
const C = {
  ink: "#03050c", deep: "#070b1a", navy: "#0c1530", navy2: "#15224a", haze: "#263868",
  amber: "#ffb24a", amberHot: "#ffd28a", ember: "#ff7a26", paper: "#f2e8d4",
};
// ---------- helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const ss = (a, b, x) => { const k = inv(a, b, x); return k * k * (3 - 2 * k); };
const eio = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2);
const eout = (k) => 1 - Math.pow(1 - k, 3);
const ein = (k) => k * k * k;
const expoIn = (k) => (k <= 0 ? 0 : Math.pow(2, 10 * k - 10));
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const noise1 = (t, s = 0) => (Math.sin(t * 12.9898 + s * 78.233) * 0.5 + Math.sin(t * 4.1 + s * 3.7) * 0.3 + Math.sin(t * 27.3 + s) * 0.2);
const flick = (t, s = 0) => 0.86 + 0.08 * noise1(t * 1.3, s) + 0.06 * Math.sin(t * 31 + s * 5);

// ---------- world: procedural skyline layers
function makeLayer(seed, n, minH, maxH, wMin, wMax, kinds, span) {
  const r = rng(seed), out = []; let x = -400;
  while (x < span) {
    const w = lerp(wMin, wMax, r()), h = lerp(minH, maxH, Math.pow(r(), 1.4));
    const kind = kinds[Math.floor(r() * kinds.length)];
    const wins = [];
    const cols = Math.max(1, Math.floor(w / 26)), rows = Math.max(1, Math.floor(h / 34));
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) if (r() < 0.32) wins.push([ (i + 0.5) / cols, (j + 0.6) / (rows + 0.4), r() ]);
    out.push({ x, w, h, kind, wins, s: r() });
    x += w + lerp(-6, 14, r());
  }
  return out;
}
const L = {
  far: makeLayer(11, 0, 60, 200, 50, 130, ["flat", "pitch", "dome", "tower"], 4200),
  mid: makeLayer(23, 0, 90, 300, 70, 170, ["flat", "pitch", "pitch", "dome", "tower", "flat"], 4200),
  near: makeLayer(37, 0, 140, 380, 110, 230, ["pitch", "flat", "pitch", "tower"], 4200),
};
function building(b, x0, base, scale, lit) {
  const x = x0 + b.x * scale, w = b.w * scale, h = b.h * scale, y = base - h;
  cx.beginPath();
  if (b.kind === "pitch") { cx.moveTo(x, base); cx.lineTo(x, y); cx.lineTo(x + w / 2, y - w * 0.42); cx.lineTo(x + w, y); cx.lineTo(x + w, base); }
  else if (b.kind === "dome") { cx.moveTo(x, base); cx.lineTo(x, y); cx.arc(x + w / 2, y, w / 2, Math.PI, 0); cx.lineTo(x + w, base);
    cx.moveTo(x + w / 2 - 2 * scale, y - w / 2 + 1); cx.lineTo(x + w / 2, y - w / 2 - 34 * scale); cx.lineTo(x + w / 2 + 2 * scale, y - w / 2 + 1); }
  else if (b.kind === "tower") { const tw = w * 0.55, tx = x + (w - tw) / 2, th = h * 0.45;
    cx.moveTo(x, base); cx.lineTo(x, y); cx.lineTo(tx, y); cx.lineTo(tx, y - th); cx.lineTo(tx + tw / 2, y - th - tw * 1.1); cx.lineTo(tx + tw, y - th); cx.lineTo(tx + tw, y); cx.lineTo(x + w, y); cx.lineTo(x + w, base); }
  else { cx.moveTo(x, base); cx.lineTo(x, y); for (let i = 0; i <= 6; i++) { const px = x + (w * i) / 6; cx.lineTo(px, y - (i % 2 ? 0 : 7 * scale)); } cx.lineTo(x + w, y); cx.lineTo(x + w, base); }
  cx.fill();
  if (lit) for (const [u, v, k] of b.wins) {
    const a = lit(x + u * w, k); if (a <= 0.01) continue;
    const ww = 7 * scale, wh = 11 * scale, wx = x + u * w - ww / 2, wy = y + v * h - wh / 2;
    cx.save(); cx.globalAlpha = a; cx.fillStyle = C.amber; cx.fillRect(wx, wy, ww, wh);
    cx.globalAlpha = a * 0.35; cx.globalCompositeOperation = "lighter"; cx.fillStyle = C.ember; cx.fillRect(wx - ww, wy - wh * 0.6, ww * 3, wh * 2.2); cx.restore();
  }
}
function skyline(layer, x0, base, scale, color, lit, haze) {
  cx.fillStyle = color; for (const b of layer) { const sx = x0 + b.x * scale; if (sx > W + 50 || sx + b.w * scale < -50) continue; building(b, x0, base, scale, lit); }
  cx.fillRect(-10, base - 1, W + 20, H - base + 2);
  if (haze) { const g = cx.createLinearGradient(0, base - 260 * scale, 0, base); g.addColorStop(0, "rgba(38,56,104,0)"); g.addColorStop(1, haze); cx.fillStyle = g; cx.fillRect(0, base - 260 * scale, W, 260 * scale + 2); }
}

// ---------- sky
const STARS = (() => { const r = rng(5), s = []; for (let i = 0; i < 260; i++) s.push([r() * 2600 - 300, r() * 760, r() * 1.6 + 0.3, r() * 6.28]); return s; })();
function sky(t, camX = 0, warm = 0, moon = null) {
  const g = cx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, C.ink); g.addColorStop(0.55, C.deep); g.addColorStop(0.85, C.navy); g.addColorStop(1, C.navy2);
  cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  if (warm > 0) { const w = cx.createLinearGradient(0, H * 0.45, 0, H); w.addColorStop(0, "rgba(255,140,50,0)"); w.addColorStop(1, `rgba(255,140,50,${0.28 * warm})`); cx.fillStyle = w; cx.fillRect(0, 0, W, H); }
  for (const [x, y, r, p] of STARS) { const a = 0.35 + 0.35 * Math.sin(t * 1.7 + p * 3); cx.fillStyle = `rgba(242,232,212,${a * 0.7})`; cx.beginPath(); cx.arc(((x - camX * 0.05) % 2400 + 2400) % 2400 - 240, y, r, 0, 6.29); cx.fill(); }
  if (moon) drawMoon(moon.x, moon.y, moon.r, moon.a ?? 1);
}
function drawMoon(x, y, r, a = 1) {
  cx.save(); cx.globalAlpha = a;
  const glow = cx.createRadialGradient(x, y, r * 0.8, x, y, r * 5); glow.addColorStop(0, "rgba(242,232,212,0.22)"); glow.addColorStop(1, "rgba(242,232,212,0)");
  cx.fillStyle = glow; cx.fillRect(x - r * 5, y - r * 5, r * 10, r * 10);
  const body = cx.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r); body.addColorStop(0, "#fbf4e6"); body.addColorStop(1, "#d9cdb6");
  cx.fillStyle = body; cx.beginPath(); cx.arc(x, y, r, 0, 6.29); cx.fill();
  cx.fillStyle = "rgba(160,150,135,0.25)"; for (const [u, v, s] of [[-0.3, -0.1, 0.22], [0.25, 0.2, 0.16], [0.1, -0.4, 0.1], [-0.05, 0.35, 0.12]]) { cx.beginPath(); cx.arc(x + u * r, y + v * r, s * r, 0, 6.29); cx.fill(); }
  cx.restore();
}

// ---------- characters & props (silhouettes; feet at 0,0, ~1 unit = 1 px * s)
function guard(x, y, s, t, opt = {}) {
  // Armoured guard, side-on, facing +x. Feet at (0,0); body ~500 units tall, spear ~700.
  const face = opt.face ?? 1, wind = opt.wind ?? 0, col = opt.color || C.ink;
  const br = Math.sin(t * 1.25) * 1.8, shift = Math.sin(t * 0.45) * 1.5;           // breathing, weight shift
  const w = (u, sp = 1) => Math.sin(t * 2.3 * sp + u) * (4 + wind * 0.8);          // cloth wave
  cx.save(); cx.translate(x, y); cx.scale(s * face, s); cx.fillStyle = col;
  const P = (pts) => { cx.beginPath(); cx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) cx.lineTo(pts[i][0], pts[i][1]); cx.closePath(); cx.fill(); };
  // ---- cloak (behind everything)
  cx.beginPath(); cx.moveTo(-26, -414 - br); cx.quadraticCurveTo(-52, -330, -70 - wind * 2 + w(0), -200);
  cx.quadraticCurveTo(-92 - wind * 4 + w(1), -110, -104 - wind * 6 + w(2), -36);
  const hem = [[-104, -36], [-80, -28], [-58, -40], [-36, -30], [-14, -44]];
  hem.forEach(([hx, hy], i) => cx.lineTo(hx - wind * (6 - i) + w(i * 1.3, 1.4), hy + Math.sin(t * 3 + i) * 3));
  cx.quadraticCurveTo(-6, -200, 18, -414 - br); cx.closePath(); cx.fill();
  // ---- spear (planted in front of the toes)
  cx.fillRect(62, -650, 6, 650);
  cx.beginPath(); cx.moveTo(65, -720); cx.quadraticCurveTo(80, -682, 65, -648); cx.quadraticCurveTo(50, -682, 65, -720); cx.fill();
  cx.fillRect(56, -650, 18, 5);
  // ---- back arm (hand resting on the sword pommel)
  P([[-30, -410 - br], [-12, -404 - br], [-26, -340], [-18, -312], [-30, -300], [-44, -314], [-42, -344]]);
  // ---- sword in scabbard, angled back
  cx.save(); cx.translate(-14, -304); cx.rotate(0.62);
  cx.fillRect(-4, 0, 9, 150); cx.beginPath(); cx.moveTo(-4, 150); cx.lineTo(5, 150); cx.lineTo(0.5, 162); cx.fill();
  cx.fillRect(-14, -4, 30, 6); cx.fillRect(-3, -26, 7, 24); cx.beginPath(); cx.arc(0.5, -30, 6, 0, 6.29); cx.fill(); cx.restore();
  // ---- legs (back leg first), greaves and boots
  const leg = (dx, toe) => { P([[dx - 4, -300], [dx + 24, -300], [dx + 26, -164], [dx + 20, -34], [dx + 24, -26], [dx + toe, -8], [dx + toe + 2, 0], [dx + 2, 0], [dx, -14], [dx + 4, -32], [dx - 2, -112], [dx + 2, -164]]);
    cx.beginPath(); cx.arc(dx + 21, -162, 11, 0, 6.29); cx.fill(); };
  leg(-24 + shift, 26); leg(10 + shift, 30);
  // ---- hip plates (tassets) + belt
  P([[-36 + shift, -306], [38 + shift, -306], [44 + shift, -236], [6 + shift, -228], [-40 + shift, -238]]);
  cx.fillRect(-35 + shift, -314, 72, 12);
  // ---- torso: breastplate rises with breath
  cx.save(); cx.translate(shift * 0.6, -br);
  P([[-32, -306], [32, -306], [40, -352], [42, -384], [30, -418], [-26, -418], [-36, -384], [-34, -346]]);
  // gorget + neck
  P([[-16, -418], [18, -418], [14, -444], [-10, -444]]);
  // back pauldron, front pauldron (two lames each)
  cx.beginPath(); cx.ellipse(-24, -404, 22, 15, -0.25, 0, 6.29); cx.fill();
  cx.beginPath(); cx.ellipse(24, -406, 27, 17, 0.25, 0, 6.29); cx.fill();
  cx.beginPath(); cx.ellipse(30, -386, 22, 12, 0.35, 0, 6.29); cx.fill();
  // front arm: upper arm, vambrace, fist around the spear
  P([[18, -404], [40, -390], [48, -346], [36, -340], [22, -380]]);
  P([[36, -350], [50, -350], [66, -332], [58, -318], [42, -324]]);
  cx.beginPath(); cx.roundRect(54, -352, 22, 34, 8); cx.fill();
  // ---- head: kettle helm with brim, cheek guard and nasal bar
  cx.beginPath(); cx.moveTo(-22, -446); cx.lineTo(-26, -470); cx.arc(2, -470, 28, Math.PI, 0); cx.lineTo(30, -462); cx.lineTo(22, -452); cx.lineTo(18, -444); cx.closePath(); cx.fill();
  P([[-34, -470], [38, -470], [34, -464], [-30, -464]]);
  cx.fillRect(28, -470, 4, 22);
  // horsehair crest streaming back in the wind
  cx.beginPath(); cx.moveTo(22, -488); cx.quadraticCurveTo(4, -514, -28, -500);
  const tip = (k) => [-58 - wind * 3 - k * 10 + Math.sin(t * 4 + k) * 5, -470 + k * 14 + Math.sin(t * 3.3 + k * 2) * 4];
  const [ax1, ay1] = tip(0), [ax2, ay2] = tip(1), [ax3, ay3] = tip(2);
  cx.quadraticCurveTo(-46, -496, ax1, ay1); cx.lineTo(-40, -478); cx.quadraticCurveTo(-48, -472, ax2, ay2); cx.lineTo(-34, -470);
  cx.quadraticCurveTo(-40, -462, ax3, ay3); cx.quadraticCurveTo(-22, -474, -8, -494); cx.quadraticCurveTo(6, -500, 18, -484); cx.closePath(); cx.fill();
  cx.restore();
  // ---- plate edges catch the light
  if (opt.detail) {
    cx.save(); cx.translate(shift * 0.6, 0); cx.globalCompositeOperation = "lighter"; cx.strokeStyle = opt.detail; cx.lineWidth = 2.2; cx.lineCap = "round";
    const L2 = (a, b, c, d) => { cx.beginPath(); cx.moveTo(a, b); cx.lineTo(c, d); cx.stroke(); };
    L2(-34, -302, 37, -302); L2(-38, -270, 41, -270); L2(-30, -464 - br, 34, -464 - br);
    cx.beginPath(); cx.ellipse(24, -406 - br, 27, 17, 0.25, -2.6, -0.2); cx.stroke();
    cx.beginPath(); cx.ellipse(30, -386 - br, 22, 12, 0.35, -2.4, 0); cx.stroke();
    cx.beginPath(); cx.arc(2, -470 - br, 28, -2.2, -0.3); cx.stroke();
    L2(40, -352 - br, 42, -384 - br); cx.beginPath(); cx.arc(31 + shift, -162, 11, -1.4, 1.2); cx.stroke();
    cx.restore();
  }
  cx.restore();
}
function guardLit(x, y, s, t, opt = {}, dx = -4) {
  cx.save(); cx.globalAlpha = 0.5 * flick(t, 2); guard(x + dx * 0.7, y - 1, s, t, { ...opt, color: "rgba(255,165,80,0.9)" }); cx.restore();
  cx.save(); cx.globalAlpha = 0.28; guard(x - dx * 0.5, y - 1, s, t, { ...opt, color: "rgba(120,140,200,0.7)" }); cx.restore();
  guard(x, y, s, t, { ...opt, detail: `rgba(255,170,90,${0.35 * flick(t, 2)})` });
}
function lantern(x, y, s, t, on = 1, seed = 0, glowSize = 1) {
  const f = flick(t, seed) * on;
  if (on > 0) {
    cx.save(); cx.globalCompositeOperation = "lighter";
    const R = 520 * s * glowSize * (0.92 + 0.08 * f);
    const g = cx.createRadialGradient(x, y, 0, x, y, R);
    g.addColorStop(0, `rgba(255,190,90,${0.55 * f})`); g.addColorStop(0.18, `rgba(255,150,60,${0.22 * f})`); g.addColorStop(1, "rgba(255,120,40,0)");
    cx.fillStyle = g; cx.fillRect(x - R, y - R, R * 2, R * 2); cx.restore();
  }
  cx.save(); cx.translate(x, y); cx.scale(s, s);
  // glass
  cx.fillStyle = on > 0 ? `rgba(255,${170 + 40 * f},${90 + 30 * f},${0.18 + 0.5 * on})` : "rgba(30,40,70,0.6)";
  cx.beginPath(); cx.roundRect(-34, -50, 68, 100, 10); cx.fill();
  // flame
  if (on > 0) {
    const fh = 46 * (0.85 + 0.2 * f) * on, fw = 15 * (0.9 + 0.1 * Math.sin(t * 17 + seed));
    const sway = Math.sin(t * 9 + seed) * 3;
    const fg = cx.createRadialGradient(0, 18, 2, 0, 0, fh); fg.addColorStop(0, "#fff6dc"); fg.addColorStop(0.35, C.amberHot); fg.addColorStop(1, C.ember);
    cx.fillStyle = fg; cx.beginPath(); cx.moveTo(0, 30); cx.bezierCurveTo(fw, 26, fw, 0, sway, 30 - fh); cx.bezierCurveTo(-fw, 0, -fw, 26, 0, 30); cx.fill();
  }
  // frame
  cx.fillStyle = C.ink;
  for (const bx of [-36, -12, 10, 32]) cx.fillRect(bx, -52, 4, 104);
  cx.beginPath(); cx.moveTo(-44, -50); cx.lineTo(44, -50); cx.lineTo(26, -78); cx.lineTo(-26, -78); cx.fill();
  cx.fillRect(-44, 48, 88, 12); cx.fillRect(-30, 60, 60, 8);
  cx.lineWidth = 6; cx.strokeStyle = C.ink; cx.beginPath(); cx.arc(0, -92, 16, 0, 6.29); cx.stroke();
  cx.restore();
}
function wall(x0, top, color, camX = 0, crenel = true) {
  cx.fillStyle = color; cx.fillRect(-20, top, W + 40, H - top + 20);
  if (crenel) for (let x = ((-camX) % 120) - 120; x < W + 120; x += 120) cx.fillRect(x, top - 48, 64, 50);
  cx.fillStyle = "rgba(255,255,255,0.025)";
  for (let r = 0; r < 6; r++) for (let x = ((-camX) % 160) - 160 + (r % 2) * 80; x < W + 160; x += 160) cx.fillRect(x, top + 30 + r * 70, 150, 2);
}
function dust(t, x, y, R, n = 40, seed = 3) {
  const r = rng(seed); cx.save(); cx.globalCompositeOperation = "lighter";
  for (let i = 0; i < n; i++) { const a = r() * 6.28, d = Math.sqrt(r()) * R, sp = 8 + r() * 18, ph = r() * 50;
    const px = x + Math.cos(a) * d + Math.sin((t + ph) * 0.6) * 20, py = y + Math.sin(a) * d - ((t * sp + ph * 10) % (R * 2)) + R;
    const fade = 1 - Math.hypot(px - x, py - y) / R; if (fade <= 0) continue;
    cx.fillStyle = `rgba(255,200,130,${0.5 * fade})`; cx.beginPath(); cx.arc(px, py, 1.2 + r() * 1.6, 0, 6.29); cx.fill(); }
  cx.restore();
}
function hills(base, color, seed, amp, camX = 0, f = 1) {
  cx.fillStyle = color; cx.beginPath(); cx.moveTo(-10, H);
  for (let x = -10; x <= W + 10; x += 8) { const u = (x + camX * f) / 900; cx.lineTo(x, base - amp * (0.5 + 0.3 * Math.sin(u * 2.1 + seed) + 0.2 * Math.sin(u * 5.3 + seed * 2))); }
  cx.lineTo(W + 10, H); cx.fill();
}
const TORCH = (() => { const r = rng(91), a = []; for (let i = 0; i < 46; i++) a.push({ x: 140 + r() * 1640, y: 0, d: r(), at: 0, s: r() * 9 }); a.sort((p, q) => p.x - q.x);
  const order = a.map((_, i) => i).sort(() => r() - 0.5); order.forEach((k, i) => (a[k].at = i / a.length)); return a; })();
function torch(x, y, size, a, t, seed) {
  if (a <= 0) return; const f = flick(t * 1.4, seed);
  cx.save(); cx.globalCompositeOperation = "lighter";
  const R = 26 * size * (0.85 + 0.15 * f); const g = cx.createRadialGradient(x, y, 0, x, y, R);
  g.addColorStop(0, `rgba(255,215,140,${a})`); g.addColorStop(0.25, `rgba(255,140,50,${0.5 * a})`); g.addColorStop(1, "rgba(255,110,40,0)");
  cx.fillStyle = g; cx.fillRect(x - R, y - R, 2 * R, 2 * R);
  cx.fillStyle = `rgba(255,230,180,${a})`; cx.beginPath(); cx.arc(x, y, 1.8 * size, 0, 6.29); cx.fill(); cx.restore();
}

// ---------- text
function caption(str, t, a, b, y = H - 150) {
  const k = Math.min(ss(a, a + 0.9, t), 1 - ss(b - 0.7, b, t)); if (k <= 0) return;
  cx.save(); cx.globalAlpha = k; cx.font = '500 54px "CG"'; cx.textAlign = "center"; cx.fillStyle = C.paper;
  cx.shadowColor = "rgba(0,0,0,0.6)"; cx.shadowBlur = 24;
  cx.translate(W / 2, y + (1 - eout(inv(a, a + 1.2, t))) * 14); cx.fillText(str, 0, 0); cx.restore();
}
function bigWord(str, k = 1, color = C.amber) {
  cx.save(); cx.font = '600 330px "CSC"'; cx.textAlign = "center"; cx.textBaseline = "middle";
  cx.translate(W / 2, H / 2); cx.scale(1 + 0.06 * (1 - k), 1 + 0.06 * (1 - k)); cx.fillStyle = color; cx.fillText(str, 0, 10); cx.restore();
}

// ---------- title embers (targets sampled from the set title)
let EMB = null;
function buildEmbers() {
  const oc = document.createElement("canvas"); oc.width = W; oc.height = H; const o = oc.getContext("2d");
  o.font = '600 168px "CSC"'; o.textAlign = "center"; o.textBaseline = "middle"; o.fillStyle = "#fff";
  const str = "THE LAST WATCH"; o.fillText(str, W / 2, H / 2 - 30);
  const total = o.measureText(str).width, left = W / 2 - total / 2;
  const bounds = []; let acc = 0; for (const ch of str) { const w = o.measureText(ch).width; bounds.push([left + acc, left + acc + w]); acc += w; }
  const d = o.getImageData(0, 0, W, H).data, r = rng(77), pts = [];
  for (let y = 0; y < H; y += 4) for (let x = 0; x < W; x += 4) if (d[(y * W + x) * 4 + 3] > 128 && r() < 0.75) {
    let li = bounds.findIndex(([a, b]) => x >= a && x < b); if (li < 0) li = 0;
    pts.push({ tx: x, ty: y, sx: x + (r() - 0.5) * 900, sy: H + 40 + r() * 400, li, j: r() });
  }
  EMB = { pts, n: str.length };
}

// ---------- post
const GRAIN = [0, 1, 2, 3].map((i) => { const g = document.createElement("canvas"); g.width = g.height = 256; const o = g.getContext("2d"), im = o.createImageData(256, 256), r = rng(100 + i);
  for (let p = 0; p < im.data.length; p += 4) { const v = 128 + (r() - 0.5) * 255; im.data[p] = im.data[p + 1] = im.data[p + 2] = v; im.data[p + 3] = 255; } o.putImageData(im, 0, 0); return g; });
function post(t, frame) {
  cx.save(); cx.globalCompositeOperation = "overlay"; cx.globalAlpha = 0.09; cx.fillStyle = cx.createPattern(GRAIN[frame % 4], "repeat"); cx.fillRect(0, 0, W, H); cx.restore();

function shotC2(t) { // 18.2–19.6 lantern close, push in

}
function shotC3(t) { // 19.6–22 match cut: lantern glow -> moon, pull back
  const k = eout(inv(19.6, 22, t)), r = lerp(150, 92, k);
  sky(t, 0, 0, null); camera(1, 0, 0, () => {
    drawMoon(W / 2, H / 2 - 10 - 90 * k, r);

}
function horizonScene(t, z, revealK, rowY = 700, extraTorch = 0) {

function shotD(t) { // 22–30 torches appear one by one; speed ramp in

// fast cuts 30–38
function gate(t, k) {

function turning(t, k) {
  sky(t, 0, 0.35, { x: W / 2 + 40, y: 470, r: 330 }); skyline(L.mid, -600, 1010, 0.7, "#0b1229", (x, kk) => (kk < 0.05 ? 0.7 : 0));
  wall(0, 960, "#03050c", 0);
  const face = Math.cos(eio(clamp(k * 1.6)) * Math.PI); guard(W / 2, 938, 0.98, t, { detail: "rgba(150,170,220,0.35)", face: Math.abs(face) < 0.12 ? 0.12 * Math.sign(face || 1) : face, wind: 10 });
}
function shotE(t) {

}
function shotF(t) { // 38–44 second lantern, the city lights up behind him

function scene(t) {
  if (t < 6) shotA(t); else if (t < 14) shotB(t); else if (t < 18.2) shotC1(t); else if (t < 19.6) shotC2(t); else if (t < 22) shotC3(t);
