<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Anton"; src: url("fonts/Anton-Regular.ttf"); }
@font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf"); font-weight: 100 900; }
html, body { margin: 0; background: #000; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Showreel: collage intro -> one-by-one (each enters over the last) -> grid -> end card. render(frame) is async.
const W = 1920, H = 1080, FPS = 30, BG = "#0c0c0e", ACC = "#ff4d2e", INK = "#f3f1ec", MUTED = "#a9a59d";
const cv = document.getElementById("c"), cx = cv.getContext("2d");
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k, inv = (a, b, x) => clamp((x - a) / (b - a));
const eio = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2), eout = (k) => 1 - Math.pow(1 - k, 3);
const back = (k) => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const expoIO = (k) => (k <= 0 ? 0 : k >= 1 ? 1 : k < 0.5 ? Math.pow(2, 20 * k - 10) / 2 : (2 - Math.pow(2, -20 * k + 10)) / 2);

// clip id -> { vert, ranges: { mode: [srcStart, frameCount] } }
const CL = {
  K: { vert: 1, r: { col: [0.6, 156], solo: [2.45, 108] } },  S: { vert: 0, r: { col: [14.0, 156], solo: [26.25, 108] } },
  N: { vert: 1, r: { col: [0.5, 156], solo: [3.15, 108] } }, KK: { vert: 0, r: { col: [10.2, 156], solo: [0.0, 108] } },
  SS: { vert: 0, r: { col: [2.5, 156], solo: [0.5, 108] } }, C: { vert: 0, r: { col: [0.3, 156], solo: [0.0, 78] } },
  LW: { vert: 0, r: { col: [38.5, 156], solo: [29.45, 579] } }, LG: { vert: 0, r: { col: [5.0, 156], solo: [4.45, 72] } },
};
const LABEL = { K: ["Kicks Drop", "Social ad pack"], S: ["Splitly", "App explainer"], N: ["NOVA", "Product launch"], KK: ["Kettle & Kiln", "Brand identity in motion"],
  SS: ["Say It Slower", "Kinetic typography"], C: ["CORVO Knockout", "Social ad pack"], LW: ["The Last Watch", "Story trailer"], LG: ["Lagos in 24 Frames", "Experimental"] };
const cache = new Map();
function img(id, mode, src) {
  const [s0, n] = CL[id].r[mode]; const i = clamp(Math.round((src - s0) * FPS), 0, n - 1) + 1;
  const p = `frames/${id}_${mode}/f${String(i).padStart(5, "0")}.jpg`;
  if (!cache.has(p)) { const im = new Image(); im.src = p; cache.set(p, im.decode().then(() => im)); if (cache.size > 400) cache.delete(cache.keys().next().value); }
  return cache.get(p);
}
function rr(x, y, w, h, r) { cx.beginPath(); cx.roundRect(x, y, w, h, r); }
// draw an image into rect; verticals placed in a wide rect get a blurred fill
function put(im, vert, x, y, w, h, { r = 0, a = 1, shadow = 0, dim = 0 } = {}) {
  cx.save(); cx.globalAlpha = a;
  if (shadow) { cx.shadowColor = "rgba(0,0,0,0.55)"; cx.shadowBlur = 50 * shadow; cx.shadowOffsetY = 18 * shadow; rr(x, y, w, h, r); cx.fillStyle = "#000"; cx.fill(); cx.shadowColor = "transparent"; }
  rr(x, y, w, h, r); cx.clip();
  const ia = im.width / im.height, ra = w / h;
  if (vert && ra > ia * 1.2) {
    cx.filter = "blur(28px) brightness(0.42)"; const sw = w * 1.15, sh = sw / ia; cx.drawImage(im, x - (sw - w) / 2, y + (h - sh) / 2, sw, sh); cx.filter = "none";
    const fh = h, fw = fh * ia; cx.drawImage(im, x + (w - fw) / 2, y, fw, fh);
  } else { let dw = w, dh = w / ia; if (dh < h) { dh = h; dw = h * ia; } cx.drawImage(im, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh); }
  if (dim > 0) { cx.fillStyle = `rgba(0,0,0,${dim})`; cx.fillRect(x, y, w, h); }
  cx.restore();
}
async function panel(id, mode, src, c, opt = {}) { // c = {x, y, w, h, rot, s}
  const im = await img(id, mode, src);
  cx.save(); cx.translate(c.x, c.y); cx.rotate(((c.rot || 0) * Math.PI) / 180); cx.scale(c.s ?? 1, c.s ?? 1);
  put(im, CL[id].vert, -c.w / 2, -c.h / 2, c.w, c.h, opt); cx.restore();
}
const wide = (x, y, w) => ({ x, y, w, h: (w * 9) / 16 }), tall = (x, y, h) => ({ x, y, w: (h * 9) / 16, h });
const FULL = { x: W / 2, y: H / 2, w: W, h: H, rot: 0 };
const lerpRect = (a, b, k) => ({ x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k), w: lerp(a.w, b.w, k), h: lerp(a.h, b.h, k), rot: lerp(a.rot || 0, b.rot || 0, k) });

// ---------------- 1. collage (0–5)
const COL = [
  ["K", tall(600, 430, 660), -2, [-1, 0]], ["S", wide(1390, 320, 720), 2.5, [1, -1]], ["N", tall(990, 480, 600), -1, [0, 1]], ["LW", wide(1190, 770, 860), -1.5, [1, 0]],
  ["KK", wide(460, 810, 640), 2, [-1, 1]], ["SS", wide(1660, 640, 560), 3, [1, 0]], ["C", wide(1480, 960, 600), -2, [0, 1]], ["LG", wide(240, 420, 520), -3, [-1, -1]],
];
async function collage(t) {
  cx.fillStyle = BG; cx.fillRect(0, 0, W, H);
  const out = inv(3.8, 5.0, t), ko = eio(out), z = 1 + 0.06 * eout(inv(0, 3.8, t));
  cx.save(); cx.translate(W / 2, H / 2); cx.scale(lerp(z, 1, ko), lerp(z, 1, ko)); cx.translate(-W / 2, -H / 2);
  const order = COL.map((p, i) => [p, i]);
  order.sort((a, b) => (a[0][0] === "K" ? 1 : 0) - (b[0][0] === "K" ? 1 : 0)); // A on top once it grows
  for (const [[id, rect, rot, dir], i] of (out > 0 ? order : COL.map((p, i) => [p, i]))) {
    const te = i * 0.25, k = inv(te, te + 0.6, t); if (k <= 0) continue;
    const kb = back(k), drift = Math.sin(t * 0.7 + i * 1.7) * 8;
    let c = { x: rect.x + dir[0] * 1500 * (1 - kb) + drift, y: rect.y + dir[1] * 1100 * (1 - kb) + Math.cos(t * 0.6 + i) * 6, w: rect.w, h: rect.h, rot: rot * (1 + 3 * (1 - kb)), s: lerp(0.9, 1, eout(k)) };
    const src = CL[id].r.col[0] + Math.max(0, t - te);
    let a = 1, r = 16;
    if (out > 0) {
      if (id === "K") { c = lerpRect(c, FULL, ko); c.s = lerp(c.s, 1, ko); r = lerp(16, 0, ko); }
      else { const dx = rect.x - W / 2, dy = rect.y - H / 2, d = Math.hypot(dx, dy) || 1; c.x += (dx / d) * 1100 * ein(out); c.y += (dy / d) * 800 * ein(out); a = 1 - out; c.s *= 1 + 0.25 * out; }
    }
    await panel(id, "col", src, c, { r, a, shadow: id === "K" && out > 0 ? 0 : 1 });
  }
  cx.restore();
}
const ein = (k) => k * k * k;

// ---------------- 2. one by one (5–26): each enters as a card over the last, then fills the frame
const SEG = [["K", 5.0, 8.0], ["S", 8.0, 11.0], ["N", 11.0, 13.5], ["KK", 13.5, 16.5], ["SS", 16.5, 19.5], ["C", 19.5, 21.5], ["LW", 21.5, 40.1], ["LG", 40.1, 42.1]];
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const soloSrc = (id, start, t) => CL[id].r.solo[0] + (t - (start - 0.55));
async function solos(t) {
  cx.fillStyle = BG; cx.fillRect(0, 0, W, H);
  let i = SEG.findIndex(([, s, e]) => t >= s && t < e); if (i < 0) i = SEG.length - 1;
  const [id, s, e] = SEG[i], nxt = SEG[i + 1];
  const entering = nxt && t >= e - 0.55;
  // current, pushed back while the next one expands over it
  const k2 = entering ? eio(inv(e - 0.3, e, t)) : 0;
  const cur = { ...FULL, s: 1 - 0.08 * k2 };
  await panel(id, "solo", soloSrc(id, s, t), cur, { r: 24 * k2, dim: 0.45 * (entering ? eout(inv(e - 0.55, e - 0.25, t)) : 0) });
  if (!entering) label(id, t, s, e);
  if (entering) {
    const [nid] = nxt, d = DIRS[(i + 1) % 4], k1 = eout(inv(e - 0.55, e - 0.25, t));
    const inset = { ...wide(W / 2 + d[0] * 520, H / 2 + d[1] * 300, 560), rot: d[0] * 2 };
    if (CL[nid].vert) Object.assign(inset, { ...tall(W / 2 + d[0] * 560, H / 2 + d[1] * 220, 520), rot: d[0] * 2 });
    const off = { ...inset, x: inset.x + d[0] * 1400, y: inset.y + d[1] * 1000, rot: d[0] * 8 };
    const c = k2 > 0 ? lerpRect(inset, FULL, k2) : lerpRect(off, inset, k1);
    await panel(nid, "solo", soloSrc(nid, e, t), c, { r: lerp(22, 0, k2), shadow: 1 - k2 });
  }
}
function label(id, t, s, e) {
  const [name, kind] = LABEL[id], k = eout(inv(s + 0.1, s + 0.45, t)) * (1 - inv(Math.min(e - 0.75, s + 3.0), Math.min(e - 0.55, s + 3.3), t)); if (k <= 0) return;
  cx.save(); cx.globalAlpha = k; cx.translate(64, H - 70 + (1 - k) * 18);
  const g = cx.createLinearGradient(0, -170, 0, 70); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,0.55)"); cx.fillStyle = g; cx.fillRect(-64, -170, 900, 240);
  cx.fillStyle = ACC; cx.fillRect(0, -64, 34, 5);
  cx.font = '400 54px "Anton"'; cx.fillStyle = INK; cx.fillText(name.toUpperCase(), 0, -6);
  cx.font = '500 24px "Inter"'; cx.fillStyle = MUTED; cx.fillText(kind, 0, 30); cx.restore();
}

// ---------------- 3. grid (26–29) and 4. end card (29–32)
const GRID = ["A", "B", "C", "D", "E", "F", "G", "H", "I"];
async function grid(t) {
  cx.fillStyle = BG; cx.fillRect(0, 0, W, H);
  const out = eio(inv(28.4, 29.0, t)), z = lerp(1.0, 0.82, out);
  cx.save(); cx.translate(W / 2, H / 2); cx.scale(z, z); cx.translate(-W / 2, -H / 2); cx.globalAlpha = 1 - out;
  const tw = 560, th = 315, gap = 24, x0 = (W - (3 * tw + 2 * gap)) / 2 + tw / 2, y0 = (H - (3 * th + 2 * gap)) / 2 + th / 2;
  for (let n = 0; n < 9; n++) {
    const id = GRID[n], te = 26.0 + n * 0.08, k = inv(te, te + 0.45, t); if (k <= 0) continue;
    const c = { x: x0 + (n % 3) * (tw + gap), y: y0 + Math.floor(n / 3) * (th + gap), w: tw, h: th, s: lerp(0.55, 1, back(k)) };
    const src = id === "A" ? 0.5 + (t - 26) : CL[id].r.col[0] + (t - 26);
    await panel(id, "col", src, c, { r: 12, a: clamp(k * 2) });
  }
  cx.restore();
}
function endCard(t) {
  cx.fillStyle = BG; cx.fillRect(0, 0, W, H);
  const a = (t0) => eout(inv(t0, t0 + 0.4, t));
  cx.save(); cx.textAlign = "left"; cx.textBaseline = "alphabetic";
  cx.font = '400 230px "Anton"'; const wN = cx.measureText("CLOWN").width, wD = cx.measureText(".").width, x = (W - wN - wD) / 2;
  cx.globalAlpha = a(29.05); cx.fillStyle = INK; cx.fillText("CLOWN", x, 560 + (1 - a(29.05)) * 30);
  cx.globalAlpha = a(29.25); cx.fillStyle = ACC; cx.fillText(".", x + wN, 560);
  cx.textAlign = "center"; cx.font = '500 34px "Inter"'; cx.fillStyle = MUTED; cx.globalAlpha = a(29.5); cx.letterSpacing = "8px"; cx.fillText("MOTION DESIGNER", W / 2 + 4, 650);
  cx.letterSpacing = "0px"; cx.font = '600 46px "Inter"'; cx.fillStyle = ACC; cx.globalAlpha = a(29.8); cx.fillText("tun832061@gmail.com", W / 2, 750);
  cx.restore();
  const out = inv(31.6, 32, t); if (out > 0) { cx.fillStyle = `rgba(0,0,0,${out})`; cx.fillRect(0, 0, W, H); }
}

window.render = async (frame) => {
  if (cx.reset) cx.reset(); const t = frame / FPS;
  if (t < 5) await collage(t); else if (t < 42.1) await solos(t); else endCard(t - 13.1);
};
window.ready = document.fonts.ready.then(() => Promise.all([document.fonts.load('400 40px "Anton"'), document.fonts.load('500 40px "Inter"'), document.fonts.load('600 40px "Inter"')]));
</script></body></html>
