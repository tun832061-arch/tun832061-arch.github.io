<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Anton"; src: url("fonts/Anton-Regular.ttf"); }
@font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf"); font-weight: 100 900; }
html, body { margin: 0; background: #000; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Lagos in 24 Frames — 24 shots under a second each, one palette, one drum loop (120 BPM, a beat = 0.5 s).
const W = 1920, H = 1080, FPS = 30, BEAT = 0.5;
const cv = document.getElementById("c"), cx = cv.getContext("2d");
const Y = "#f7c600", K = "#121110", O = "#ff6b2c", CR = "#f4efe6";
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k, inv = (a, b, x) => clamp((x - a) / (b - a));
const eout = (k) => 1 - Math.pow(1 - k, 3), eio = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2), eout5 = (k) => 1 - Math.pow(1 - k, 5);
const back = (k) => { const c1 = 1.7, c3 = c1 + 1; return k <= 0 ? 0 : 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
function rng(s) { s >>>= 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function bg(c) { cx.fillStyle = c; cx.fillRect(0, 0, W, H); }
function rr(x, y, w, h, r, f) { cx.beginPath(); cx.roundRect(x, y, w, h, r); if (f) { cx.fillStyle = f; cx.fill(); } }
const GRAIN = [0, 1, 2].map((i) => { const g = document.createElement("canvas"); g.width = g.height = 256; const o = g.getContext("2d"), im = o.createImageData(256, 256), r = rng(9 + i);
  for (let p = 0; p < im.data.length; p += 4) { const v = 128 + (r() - 0.5) * 255; im.data[p] = im.data[p + 1] = im.data[p + 2] = v; im.data[p + 3] = 255; } o.putImageData(im, 0, 0); return g; });
function grain(f, a) { cx.save(); cx.globalCompositeOperation = "overlay"; cx.globalAlpha = a; cx.fillStyle = cx.createPattern(GRAIN[f % 3], "repeat"); cx.fillRect(0, 0, W, H); cx.restore(); }

// ================= 1. shapes morph on every beat (0–5 s, 10 shots) =================
const N = 160;
const resample = (pts) => { // closed polyline -> N evenly spaced points
  const segs = []; let L = 0; for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length], d = Math.hypot(b[0] - a[0], b[1] - a[1]); segs.push([a, b, d]); L += d; }
  const out = []; let si = 0, acc = 0; for (let k = 0; k < N; k++) { const target = (k / N) * L; while (acc + segs[si][2] < target) { acc += segs[si][2]; si++; } const [a, b, d] = segs[si], u = d ? (target - acc) / d : 0; out.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]); } return out; };
const poly = (n, r, rot = -Math.PI / 2, r2 = null) => Array.from({ length: n * (r2 ? 2 : 1) }, (_, i) => { const a = rot + (i * Math.PI * 2) / (n * (r2 ? 2 : 1)), rr2 = r2 && i % 2 ? r2 : r; return [Math.cos(a) * rr2, Math.sin(a) * rr2]; });
const rect = (w, h) => [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]];
const wave = () => { const p = []; for (let i = 0; i <= 40; i++) p.push([-520 + i * 26, -60 + Math.sin(i * 0.9) * 40]); for (let i = 40; i >= 0; i--) p.push([-520 + i * 26, 60 + Math.sin(i * 0.9) * 40]); return p; };
const busSide = () => [[-430, 140], [-430, -60], [-400, -150], [380, -150], [430, -90], [430, 140], [300, 140], [290, 100], [210, 100], [200, 140], [-200, 140], [-210, 100], [-290, 100], [-300, 140]];
const SHAPES = [ // [name, points, fg, bg]
  ["sun", poly(64, 230), Y, K], ["road", rect(1100, 26), CR, K], ["window", rect(380, 380), K, Y], ["umbrella", [[0, -230], [300, 40], [-300, 40]], O, CR],
  ["traffic light", rect(200, 520), K, O], ["generator hum", wave(), Y, K], ["wheel", poly(12, 240, 0, 200), CR, K], ["danfo", busSide(), K, Y], ["road sign", poly(4, 280), Y, K], ["sun", poly(64, 230), O, K],
].map(([n, p, f, b]) => [n, resample(p), f, b]);
// align each shape's starting point to the one before, so morphs do not twist
for (let s = 1; s < SHAPES.length; s++) { const A = SHAPES[s - 1][1], Bp = SHAPES[s][1]; let best = 0, bd = 1e18;
  for (let o = 0; o < N; o += 2) { let d = 0; for (let i = 0; i < N; i += 8) { const q = Bp[(i + o) % N]; d += (A[i][0] - q[0]) ** 2 + (A[i][1] - q[1]) ** 2; } if (d < bd) { bd = d; best = o; } }
  SHAPES[s][1] = Bp.map((_, i) => Bp[(i + best) % N]); }
function shapes(t) {
  const i = Math.min(9, Math.floor(t / BEAT)), k = eout5(inv(i * BEAT, i * BEAT + 0.22, t)), prev = SHAPES[Math.max(0, i - 1)], cur = SHAPES[i];
  bg(cur[3]); const pulse = 1 + 0.06 * Math.exp(-(t - i * BEAT) * 10);
  cx.save(); cx.translate(W / 2, H / 2); cx.scale(pulse, pulse); cx.rotate((1 - k) * (i % 2 ? 0.3 : -0.3));
  cx.beginPath(); cur[1].forEach((q, j) => { const p = i === 0 ? q : [lerp(prev[1][j][0], q[0], k), lerp(prev[1][j][1], q[1], k)]; j ? cx.lineTo(p[0], p[1]) : cx.moveTo(p[0], p[1]); }); cx.closePath(); cx.fillStyle = cur[2]; cx.fill();
  if (cur[0] === "traffic light" && k > 0.6) [["#e33", -160], [Y, 0], ["#2c6", 160]].forEach(([c, y], j) => { cx.beginPath(); cx.arc(0, y, 62, 0, 6.29); cx.fillStyle = j === Math.floor((t - i * BEAT) * 6) % 3 ? c : "#2a2826"; cx.fill(); });
  if (cur[0] === "window" && k > 0.6) { cx.fillStyle = cur[3]; cx.fillRect(-8, -190, 16, 380); cx.fillRect(-190, -8, 380, 16); }
  if (cur[0] === "danfo" && k > 0.6) { cx.fillStyle = K; cx.fillRect(-430, 10, 860, 26); cx.fillStyle = Y; for (let w = 0; w < 6; w++) cx.fillRect(-370 + w * 120, -120, 90, 80); [-250, 250].forEach((x) => { cx.beginPath(); cx.arc(x, 140, 56, 0, 6.29); cx.fillStyle = K; cx.fill(); cx.beginPath(); cx.arc(x, 140, 22, 0, 6.29); cx.fillStyle = CR; cx.fill(); }); }
  cx.restore();
  cx.font = "600 22px Inter"; cx.fillStyle = cur[2]; cx.globalAlpha = 0.8; cx.letterSpacing = "6px"; cx.fillText(`${String(i + 1).padStart(2, "0")} / 24 · ${cur[0].toUpperCase()}`, 60, H - 60); cx.letterSpacing = "0px"; cx.globalAlpha = 1;
}

// ================= 2. the danfo, 14 ways (5–12 s) =================
function danfo(x, y, s, opt = {}) { // flat side view, origin at the road under its middle
  const body = opt.body || Y, ink = opt.ink || K, wheelRot = opt.wheel || 0;
  cx.save(); cx.translate(x, y); cx.scale(s, s);
  cx.beginPath(); cx.moveTo(-430, -40); cx.lineTo(-430, -240); cx.lineTo(-400, -330); cx.lineTo(380, -330); cx.lineTo(430, -260); cx.lineTo(430, -40); cx.closePath(); cx.fillStyle = body; cx.fill();
  cx.fillStyle = ink; cx.fillRect(-430, -170, 860, 22); cx.fillRect(-430, -128, 860, 10);
  for (let w = 0; w < 6; w++) cx.fillRect(-380 + w * 118, -305, 92, 92);
  cx.fillRect(330, -305, 70, 140); cx.fillRect(-430, -60, 860, 20);
  [-260, 250].forEach((wx) => { cx.save(); cx.translate(wx, -40); cx.rotate(wheelRot); cx.beginPath(); cx.arc(0, 0, 70, 0, 6.29); cx.fillStyle = ink; cx.fill(); cx.beginPath(); cx.arc(0, 0, 30, 0, 6.29); cx.fillStyle = CR; cx.fill(); cx.fillStyle = ink; for (let s2 = 0; s2 < 5; s2++) { cx.rotate(1.2566); cx.fillRect(-3, 6, 6, 22); } cx.restore(); });
  cx.restore();
}
const M = [
  (k, t) => { bg(O); for (let i = 0; i < 12; i++) { cx.fillStyle = K; cx.fillRect(((i * 220 - t * 2400) % 2640 + 2640) % 2640 - 360, 900, 120, 14); } cx.fillStyle = K; cx.fillRect(0, 920, W, 160); danfo(W / 2, 900, 1, { wheel: t * 20 }); return "2D"; },
  (k, t, f) => { bg(CR); const r = rng(Math.floor(f / 2) + 3); cx.save(); cx.translate(W / 2, 880); cx.strokeStyle = K; cx.lineWidth = 7; cx.lineJoin = "round"; // boiling hand-drawn line
    const pts = [[-430, -40], [-430, -240], [-400, -330], [380, -330], [430, -260], [430, -40]]; cx.beginPath(); pts.forEach(([x, y], i) => { const jx = (r() - 0.5) * 12, jy = (r() - 0.5) * 12; i ? cx.lineTo(x + jx, y + jy) : cx.moveTo(x + jx, y + jy); }); cx.closePath(); cx.stroke();
    for (let w = 0; w < 6; w++) cx.strokeRect(-380 + w * 118 + (r() - 0.5) * 8, -305 + (r() - 0.5) * 8, 92, 92); [-260, 250].forEach((x) => { cx.beginPath(); cx.arc(x + (r() - 0.5) * 6, -40, 70 + (r() - 0.5) * 6, 0, 6.29); cx.stroke(); }); cx.restore(); return "FRAME BY FRAME"; },
  (k, t, f) => { bg(Y); const st = Math.floor(k * 7), bob = (st % 2) * 14; cx.save(); cx.shadowColor = "rgba(0,0,0,0.35)"; cx.shadowBlur = 0; cx.shadowOffsetX = 14; cx.shadowOffsetY = 14; // paper cut-out on twos
    danfo(W / 2 - 120 + st * 40, 860 - bob, 0.95, { body: CR, wheel: st * 0.7 }); cx.restore(); return "CUT-OUT"; },
  (k, t) => { bg(K); const a = t * 3.2, P = (x, y, z) => { const cs = Math.cos(a), sn = Math.sin(a), X = x * cs - z * sn, Z = x * sn + z * cs + 1400; return [W / 2 + (X * 1700) / Z, H / 2 + 40 + ((y - 50) * 1700) / Z]; };
    const bx = 430, by = 170, bz = 200, V = [[-bx, -by, -bz], [bx, -by, -bz], [bx, by, -bz], [-bx, by, -bz], [-bx, -by, bz], [bx, -by, bz], [bx, by, bz], [-bx, by, bz]].map((v) => P(...v));
    cx.strokeStyle = Y; cx.lineWidth = 4; [[0, 1], [1, 2], [2, 3], [3, 0], [4, 5], [5, 6], [6, 7], [7, 4], [0, 4], [1, 5], [2, 6], [3, 7]].forEach(([i, j]) => { cx.beginPath(); cx.moveTo(...V[i]); cx.lineTo(...V[j]); cx.stroke(); });
    for (let w = 0; w < 6; w++) { const x0 = -380 + w * 130; const q = [P(x0, -150, -bz), P(x0 + 90, -150, -bz), P(x0 + 90, -60, -bz), P(x0, -60, -bz)]; cx.beginPath(); q.forEach((p, i) => (i ? cx.lineTo(...p) : cx.moveTo(...p))); cx.closePath(); cx.stroke(); } return "3D"; },
  (k, t) => { bg(CR); const C2 = 16, off = document.createElement("canvas"); off.width = Math.ceil(W / C2); off.height = Math.ceil(H / C2); const o = off.getContext("2d");
    o.fillStyle = "#000"; o.fillRect(0, 0, off.width, off.height); o.save(); o.translate(off.width / 2 + (k - 0.5) * 16, off.height * 0.78); o.scale(0.125, 0.125);
    const g = o.createLinearGradient(-430, 0, 430, 0); g.addColorStop(0, "#fff"); g.addColorStop(1, "#777"); o.fillStyle = g; o.fillRect(-430, -330, 860, 290);
    o.fillStyle = "#000"; for (let w = 0; w < 6; w++) o.fillRect(-380 + w * 118, -305, 92, 92); o.fillRect(-430, -170, 860, 22);
    o.fillStyle = "#fff"; o.beginPath(); o.arc(-260, -40, 70, 0, 6.29); o.arc(250, -40, 70, 0, 6.29); o.fill(); o.restore();
    const d = o.getImageData(0, 0, off.width, off.height).data; cx.fillStyle = K; for (let y = 0; y < off.height; y++) for (let x = 0; x < off.width; x++) { const v = d[(y * off.width + x) * 4] / 255; if (v > 0.08) { cx.beginPath(); cx.arc(x * C2 + C2 / 2, y * C2 + C2 / 2, (C2 / 2) * 0.95 * Math.sqrt(v), 0, 6.29); cx.fill(); } }
    return "HALFTONE"; },
  (k, t) => { bg(K); cx.save(); cx.font = "400 300px Anton"; cx.fillStyle = Y; cx.textAlign = "center"; cx.textBaseline = "middle"; cx.fillText("DANFO", W / 2 + (1 - eout5(k)) * 600, H / 2 - 40); cx.restore();
    [-260, 250].forEach((x) => { cx.beginPath(); cx.arc(W / 2 + x, H / 2 + 150, 70, 0, 6.29); cx.fillStyle = CR; cx.fill(); }); return "TYPE"; },
  (k, t) => { bg(Y); cx.save(); cx.translate(W / 2, H / 2); for (let g = 0; g < 6; g++) { cx.globalAlpha = g ? 0.12 : 1; cx.rotate(t * 30 + g * 0.06); cx.beginPath(); cx.arc(0, 0, 380, 0, 6.29); cx.fillStyle = K; cx.fill(); cx.beginPath(); cx.arc(0, 0, 160, 0, 6.29); cx.fillStyle = CR; cx.fill(); cx.fillStyle = K; for (let s = 0; s < 5; s++) { cx.rotate(1.2566); cx.fillRect(-14, 30, 28, 110); } } cx.restore(); return "MOTION BLUR"; },
  (k, t) => { bg("#2a2826"); cx.fillStyle = CR; for (let x = 0; x < W; x += 480) { cx.fillRect(x + 230, 0, 20, H); } for (let y = 0; y < H; y += 360) cx.fillRect(0, y + 170, W, 20);
    for (let i = 0; i < 9; i++) { const lane = i % 3, x = ((i * 300 + t * (900 + lane * 300)) % (W + 400)) - 200, y = 90 + lane * 360; rr(x - 110, y - 46, 220, 92, 14, i === 4 ? Y : CR); if (i === 4) { cx.fillStyle = K; cx.fillRect(x - 110, y - 6, 220, 12); } } return "TOP-DOWN"; },
  (k, t) => { bg(O); cx.fillStyle = K; for (let i = 0; i < 30; i++) { const y = (i * 97) % H, l = 200 + (i * 53) % 400, x = ((i * 311 - t * 5000) % (W + 600) + W + 600) % (W + 600) - 300; cx.fillRect(x, y, l, 6); } danfo(W / 2, 860, 1.05, { body: K, ink: O, wheel: t * 30 }); return "SILHOUETTE"; },
  (k, t) => { bg(K); const px = 24, off = Math.floor(k * 10) * px; cx.save(); cx.beginPath(); cx.rect(0, 0, W, H); cx.clip();
    for (let y = 0; y < 14; y++) for (let x = 0; x < 36; x++) { const gx = x - 18, gy = y - 10, on = gx >= -16 && gx <= 16 && gy >= -6 && gy <= 0, win = on && gy >= -5 && gy <= -3 && (gx + 16) % 5 < 3, wheel = (gy === 1 || gy === 2) && (Math.abs(gx + 10) < 2 || Math.abs(gx - 10) < 2);
      if (on || wheel) { cx.fillStyle = wheel ? CR : win ? K : gy === -1 ? K : Y; cx.fillRect(W / 2 - 18 * px * 1.5 + x * px * 1.5 + off - 120, 260 + y * px * 1.5, px * 1.5 - 3, px * 1.5 - 3); } }
    cx.restore(); return "PIXEL"; },
  (k, t) => { bg(Y); const z = lerp(1, 6, eio(k)); cx.save(); cx.translate(W / 2, H / 2); cx.scale(z, z); cx.fillStyle = K; for (let i = -40; i < 40; i++) { const w = [6, 14, 4, 22, 8][((i % 5) + 5) % 5]; cx.fillRect(i * 26, -120, w, 240); } cx.restore(); return "STRIPES"; },
  (k, t) => { bg(CR); const n = 4; for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) { const on = (r * n + c) <= k * 16; if (!on) continue; danfo(c * (W / n) + W / n / 2 + Math.sin(t * 8 + r) * 10, r * (H / n) + H / n - 30, 0.25, { body: (r + c) % 2 ? Y : O, wheel: t * 20 }); } return "REPEAT"; },
  (k, t) => { bg(K); for (let l = 10; l >= 0; l--) { cx.save(); cx.translate(l * 6, -l * 6); cx.globalAlpha = l ? 0.8 : 1; danfo(W / 2 - 60, 860, 0.9, { body: l ? "#7a6400" : Y, ink: l ? "#3a3000" : K, wheel: t * 10 }); cx.restore(); } return "EXTRUDE"; },
  (k, t) => { bg(K); cx.save(); cx.translate(W / 2, H / 2 + 40); rr(-380, -300, 760, 520, 60, Y); cx.fillStyle = K; cx.fillRect(-340, -260, 680, 200); cx.fillRect(-380, 40, 760, 30);
    const flash = k > 0.55 ? 1 : 0.35 + 0.3 * Math.sin(t * 40); [-250, 250].forEach((x) => { cx.beginPath(); cx.arc(x, 130, 62, 0, 6.29); cx.fillStyle = `rgba(255,250,230,${flash})`; cx.fill(); }); cx.restore();
    if (k > 0.55) { const g = cx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, 1400 * inv(0.55, 1, k)); g.addColorStop(0, "rgba(255,248,230,1)"); g.addColorStop(1, "rgba(255,248,230,0)"); cx.fillStyle = g; cx.fillRect(0, 0, W, H); } return "HEADLIGHTS"; },
];
function montage(t, f) { const i = Math.min(13, Math.floor((t - 5) / BEAT)), k = inv(5 + i * BEAT, 5 + (i + 1) * BEAT, t); const lab = M[i](k, t, f);
  cx.font = "600 22px Inter"; cx.fillStyle = CR; cx.globalAlpha = 0.85; cx.letterSpacing = "6px"; cx.shadowColor = "rgba(0,0,0,0.5)"; cx.shadowBlur = 6; cx.fillText(`${String(11 + i).padStart(2, "0")} / 24 · ${lab}`, 60, H - 60); cx.shadowBlur = 0; cx.letterSpacing = "0px"; cx.globalAlpha = 1; }

// ================= 3. the only slow shot: sunset over the bridge (12–17 s) =================
const SKY = (() => { const r = rng(44), b = []; let x = -200; while (x < W + 400) { const w = 40 + r() * 120, h = 60 + Math.pow(r(), 2) * 380; b.push([x, w, h, r()]); x += w + r() * 8; } return b; })();
function sunset(t, f) {
  const k = inv(12, 17, t), z = lerp(1.0, 1.08, eio(k));
  cx.save(); cx.translate(W / 2, H / 2); cx.scale(z, z); cx.translate(-W / 2, -H / 2);
  const g = cx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#3a1d12"); g.addColorStop(0.45, O); g.addColorStop(0.62, Y); g.addColorStop(0.63, "#2a1a10"); g.addColorStop(1, "#120c08"); cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  const sy = lerp(560, 650, k); cx.beginPath(); cx.arc(1220, sy, 150, Math.PI, 0); cx.lineTo(1370, 680); cx.lineTo(1070, 680); cx.closePath(); cx.fillStyle = "#fff1c2"; cx.fill();
  const sg = cx.createRadialGradient(1220, sy, 100, 1220, sy, 700); sg.addColorStop(0, "rgba(255,230,160,0.55)"); sg.addColorStop(1, "rgba(255,180,80,0)"); cx.fillStyle = sg; cx.fillRect(0, 0, W, H);
  cx.fillStyle = "#1a100a"; SKY.forEach(([x, w, h]) => cx.fillRect(x - t * 6, 680 - h, w, h + 2));
  // water + sun reflection
  for (let i = 0; i < 26; i++) { const y = 700 + i * 15, w = 300 - i * 9 + Math.sin(t * 2 + i) * 30; cx.fillStyle = `rgba(255,220,140,${0.5 - i * 0.017})`; cx.fillRect(1220 - w / 2 + Math.sin(t * 1.5 + i * 0.7) * 20, y, w, 5); }
  // the long bridge with danfos crossing slowly
  cx.fillStyle = "#120b07"; cx.fillRect(0, 760, W, 22); for (let x = 40; x < W; x += 180) cx.fillRect(x, 782, 16, 300);
  for (let i = 0; i < 7; i++) { const x = ((i * 330 + t * 60) % (W + 200)) - 100; cx.fillStyle = Y; cx.fillRect(x, 738, 46, 22); cx.fillStyle = "#120b07"; cx.fillRect(x, 750, 46, 4); }
  cx.restore(); grain(f, 0.22);
  const v = cx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.55)"); cx.fillStyle = v; cx.fillRect(0, 0, W, H);
  cx.font = "600 22px Inter"; cx.fillStyle = CR; cx.globalAlpha = 0.8 * inv(12.2, 12.8, t); cx.letterSpacing = "6px"; cx.fillText("THE ONLY SLOW SHOT · 5 SECONDS", 60, H - 60); cx.letterSpacing = "0px"; cx.globalAlpha = 1;
}
// ================= 4. title builds from the pieces (17–20 s) =================
function title(t) {
  bg(K); const L = ["L", "A", "G", "O", "S"], cols = [Y, O, CR, Y, O];
  cx.font = "400 330px Anton"; const tw = cx.measureText("LAGOS").width; let x = W / 2 - tw / 2;
  L.forEach((ch, i) => { const cw = cx.measureText(ch).width, k = eout5(inv(17.0 + i * 0.12, 17.35 + i * 0.12, t)); // a shape flies in and becomes the letter
    const sh = SHAPES[[0, 3, 6, 2, 8][i]], sx = x + cw / 2, sy = H / 2 - 40;
    if (k < 1) { cx.save(); cx.translate(lerp(sx + (i - 2) * 500, sx, k), lerp(sy + (i % 2 ? -700 : 700), sy, k)); cx.scale(0.4 * (1 - k) + 0.01, 0.4 * (1 - k) + 0.01); cx.beginPath(); sh[1].forEach((p, j) => (j ? cx.lineTo(...p) : cx.moveTo(...p))); cx.closePath(); cx.fillStyle = cols[i]; cx.fill(); cx.restore(); }
    if (k > 0.6) { cx.save(); cx.globalAlpha = inv(0.6, 1, k); cx.fillStyle = cols[i]; cx.textBaseline = "middle"; cx.font = "400 330px Anton"; cx.fillText(ch, x, sy + 10); cx.restore(); }
    cx.font = "400 330px Anton"; x += cw; });
  const sk = eout(inv(17.9, 18.4, t)); cx.globalAlpha = sk; cx.font = "600 34px Inter"; cx.letterSpacing = "18px"; cx.fillStyle = CR; cx.textAlign = "center"; cx.fillText("IN 24 FRAMES", W / 2 + 9, H / 2 + 190); cx.letterSpacing = "0px";
  const nk = eout(inv(18.5, 19.0, t)); cx.globalAlpha = nk; cx.font = "400 64px Anton"; cx.fillStyle = CR; cx.fillText("CLOWN", W / 2 - 10, H - 120); cx.fillStyle = "#ff4d2e"; cx.textAlign = "left"; cx.fillText(".", W / 2 + cx.measureText("CLOWN").width / 2 - 10, H - 120); cx.textAlign = "left"; cx.globalAlpha = 1;
  const out = inv(19.6, 20, t); if (out > 0) { cx.fillStyle = `rgba(0,0,0,${out})`; cx.fillRect(0, 0, W, H); }
}
