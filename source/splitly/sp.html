<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Inter"; src: url("fonts/Inter-Variable.ttf"); font-weight: 100 900; }
html, body { margin: 0; background: #000; }
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Splitly — 50 s app explainer. render(frame) draws one frame from time alone.
const W = 1920, H = 1080, FPS = 30;
const cv = document.getElementById("c"), cx = cv.getContext("2d");
const C = { bg: "#f4f1ff", ink: "#16132b", sub: "#6b6785", line: "#e6e1f7", brand: "#6c4cff", brand2: "#a996ff", white: "#ffffff", ok: "#18b67a" };
const P = { A: { n: "Ada", c: "#ff7a59" }, B: { n: "Ben", c: "#22b8a7" }, C: { n: "Chi", c: "#f5a400" }, D: { n: "Dee", c: "#3a86ff" } };
const ITEMS = [["Pasta", 18.5, "A"], ["Burger", 16.0, "B"], ["Salad", 14.0, "C"], ["Pizza", 21.0, "D"], ["Drinks", 24.0, "ABCD"], ["Dessert", 12.5, "AC"]];
const TOT = { A: 35.36, B: 25.3, C: 30.19, D: 31.05 };
// ---------- helpers
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, k) => a + (b - a) * k, inv = (a, b, x) => clamp((x - a) / (b - a));
const eio = (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2), eout = (k) => 1 - Math.pow(1 - k, 3), eout5 = (k) => 1 - Math.pow(1 - k, 5);
const back = (k) => { const c1 = 1.7, c3 = c1 + 1; return k <= 0 ? 0 : 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };
const ui = (t, t0, d = 0.35) => eout5(inv(t0, t0 + d, t));            // UI moves: < 400 ms, eased
const pop = (t, t0, d = 0.38) => back(inv(t0, t0 + d, t));
const money = (v) => "$" + v.toFixed(2);
function rr(x, y, w, h, r, fill) { cx.beginPath(); cx.roundRect(x, y, w, h, r); if (fill) { cx.fillStyle = fill; cx.fill(); } }
function txt(s, x, y, size, weight = 600, color = C.ink, align = "left") { cx.font = `${weight} ${size}px Inter`; cx.fillStyle = color; cx.textAlign = align; cx.textBaseline = "alphabetic"; cx.fillText(s, x, y); }
function shadow(b = 40, y = 16, a = 0.14) { cx.shadowColor = `rgba(40,20,120,${a})`; cx.shadowBlur = b; cx.shadowOffsetY = y; }
function noShadow() { cx.shadowColor = "transparent"; cx.shadowBlur = 0; cx.shadowOffsetY = 0; }
function avatar(x, y, r, id, s = 1) {
  if (s <= 0) return; cx.save(); cx.translate(x, y); cx.scale(s, s);
  cx.beginPath(); cx.arc(0, 0, r, 0, 6.29); cx.fillStyle = P[id].c; cx.fill();
  cx.fillStyle = "rgba(255,255,255,0.95)"; cx.beginPath(); cx.arc(-r * 0.3, -r * 0.12, r * 0.1, 0, 6.29); cx.arc(r * 0.3, -r * 0.12, r * 0.1, 0, 6.29); cx.fill();
  cx.strokeStyle = "rgba(255,255,255,0.95)"; cx.lineWidth = r * 0.1; cx.lineCap = "round"; cx.beginPath(); cx.arc(0, r * 0.12, r * 0.32, 0.35, Math.PI - 0.35); cx.stroke();
  cx.restore();
}
function logo(x, y, r, k = 1, word = true, wordSize = 0) {
  if (k <= 0) return; cx.save(); cx.translate(x, y); cx.scale(k, k);
  const gap = r * 0.1;
  cx.beginPath(); cx.arc(-gap, 0, r, Math.PI / 2, Math.PI * 1.5); cx.closePath(); cx.fillStyle = C.brand; cx.fill();
  cx.beginPath(); cx.arc(gap, 0, r, -Math.PI / 2, Math.PI / 2); cx.closePath(); cx.fillStyle = C.brand2; cx.fill();
  if (word) txt("splitly", r * 1.35, r * 0.36, wordSize || r * 1.05, 800, C.ink);
  cx.restore();
}
function bgDots(t, tint = 0) {
  cx.fillStyle = C.bg; cx.fillRect(0, 0, W, H);
  cx.fillStyle = "rgba(108,76,255,0.10)"; for (let y = 30; y < H; y += 44) for (let x = 30 + ((y / 44) % 2) * 22; x < W; x += 44) { cx.beginPath(); cx.arc(x, y, 2, 0, 6.29); cx.fill(); }
  const b = (x, y, r, a) => { const g = cx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(169,150,255,${a})`); g.addColorStop(1, "rgba(169,150,255,0)"); cx.fillStyle = g; cx.fillRect(x - r, y - r, 2 * r, 2 * r); };
  b(1300 + Math.sin(t * 0.3) * 60, 520, 700, 0.35); b(300, 950 + Math.cos(t * 0.25) * 40, 500, 0.25);
}
// caption: words pop in one by one
function caption(lines, t, t0, t1, x = 150, y = 420, size = 92) {
  const out = ui(t, t1 - 0.3, 0.3); if (t < t0 || out >= 1) return;
  let wi = 0;
  lines.forEach((line, li) => {
    let cxp = x; const words = line.split(" ");
    for (const w of words) {
      const k = ui(t, t0 + wi * 0.12, 0.32); wi++; if (k <= 0) { cx.font = `800 ${size}px Inter`; cxp += cx.measureText(w.replace("*", "") + " ").width; continue; }
      cx.save(); cx.globalAlpha = k * (1 - out); cx.font = `800 ${size}px Inter`; const ww = cx.measureText(w + " ").width;
      cx.translate(cxp, y + li * size * 1.08 + (1 - k) * 30 - out * 20);
      const hl = w.includes("*"); const word = w.replace("*", "");
      cx.fillStyle = hl ? C.brand : C.ink; cx.textBaseline = "alphabetic"; cx.fillText(word, 0, 0); cx.restore();
      cx.font = `800 ${size}px Inter`; cxp += cx.measureText(w.replace("*", "") + " ").width;
    }
  });
}

// ---------- receipt
function receipt(x, y, w, h, t, scramble = 0, unroll = 1) {
  const hh = h * unroll; cx.save(); shadow(50, 20, 0.16);
  cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + w, y); cx.lineTo(x + w, y + hh);
  const n = 16; for (let i = n; i >= 0; i--) cx.lineTo(x + (w * i) / n, y + hh + (i % 2 ? 14 : 0)); cx.closePath(); cx.fillStyle = C.white; cx.fill(); noShadow();
  cx.beginPath(); cx.rect(x, y, w, hh); cx.clip();
  txt("NORI KITCHEN", x + w / 2, y + 70, 30, 800, C.ink, "center"); txt("Table 7 · 4 guests", x + w / 2, y + 108, 20, 500, C.sub, "center");
  cx.fillStyle = C.line; cx.fillRect(x + 36, y + 136, w - 72, 2);
  const rnd = (k, i) => { if (scramble <= 0) return k; const s = Math.floor(t * 18 + i * 7); return "$" + ((Math.sin(s * 12.9898 + i) * 43758.5453) % 1 + 1).toFixed(2).replace("0.", (10 + (s * 7 + i * 3) % 89).toString() + "."); };
  ITEMS.forEach(([name, v], i) => { const yy = y + 190 + i * 56; txt(name, x + 40, yy, 26, 500, C.ink); txt(rnd(money(v), i), x + w - 40, yy, 26, 600, scramble > 0 ? C.brand : C.ink, "right"); });
  cx.fillStyle = C.line; cx.fillRect(x + 36, y + 540, w - 72, 2);
  txt("Tip 15%", x + 40, y + 590, 24, 500, C.sub); txt(rnd("$15.90", 9), x + w - 40, y + 590, 24, 600, C.sub, "right");
  txt("Total", x + 40, y + 650, 34, 800, C.ink); txt(rnd("$121.90", 11), x + w - 40, y + 650, 34, 800, C.ink, "right");
  cx.restore();
}
// ---------- phone
const PH = { x: 1260, y: 540, w: 430, h: 880 }, SC = { w: 402, h: 852 };
function phone(t, sx, sy, screenFn, opt = {}) {
  const s = opt.s ?? 1, rot = opt.rot ?? 0;
  cx.save(); cx.translate(PH.x + (opt.dx || 0), PH.y + (opt.dy || 0)); cx.rotate(rot); cx.scale(s * sx, s * sy);
  shadow(80, 40, 0.22); rr(-PH.w / 2, -PH.h / 2, PH.w, PH.h, 66, "#15122a"); noShadow();
  cx.save(); cx.translate(-SC.w / 2, -SC.h / 2); rr(0, 0, SC.w, SC.h, 52); cx.clip(); screenFn(t); cx.restore();
  rr(-55, -PH.h / 2 + 22, 110, 30, 15, "#15122a");
  cx.restore();
}
// screens (origin = screen top-left)
function statusBar(dark = false) { txt("9:41", 34, 46, 20, 700, dark ? "#fff" : C.ink); rr(SC.w - 70, 32, 36, 16, 5, dark ? "#fff" : C.ink); }
function scrLogo(t) { cx.fillStyle = C.bg; cx.fillRect(0, 0, SC.w, SC.h); logo(SC.w / 2 - 92, SC.h / 2, 46, pop(t, 6.8, 0.45), true, 52); statusBar(); }
function scrCamera(t) {
  cx.fillStyle = "#1c1930"; cx.fillRect(0, 0, SC.w, SC.h); statusBar(true);
  cx.save(); cx.translate(SC.w / 2, 380); cx.rotate(-0.04); cx.scale(0.62, 0.62); receipt(-210, -330, 420, 680, t, 0, 1); cx.restore();
  const k = ui(t, 12.6, 0.35); cx.strokeStyle = `rgba(255,255,255,${k})`; cx.lineWidth = 5; cx.lineCap = "round";
  const bx = 60, by = 140, bw = SC.w - 120, bh = 480, L = 34;
  for (const [x, y, dx, dy] of [[bx, by, 1, 1], [bx + bw, by, -1, 1], [bx, by + bh, 1, -1], [bx + bw, by + bh, -1, -1]]) { cx.beginPath(); cx.moveTo(x + dx * L, y); cx.lineTo(x, y); cx.lineTo(x, y + dy * L); cx.stroke(); }
  txt("Fit the receipt in the frame", SC.w / 2, 680, 18, 500, "rgba(255,255,255,0.7)", "center");
  const press = 1 - 0.12 * Math.sin(Math.PI * inv(13.3, 13.6, t));
  cx.save(); cx.translate(SC.w / 2, 770); cx.scale(press, press); cx.beginPath(); cx.arc(0, 0, 38, 0, 6.29); cx.fillStyle = "#fff"; cx.fill(); cx.lineWidth = 4; cx.strokeStyle = "#1c1930"; cx.beginPath(); cx.arc(0, 0, 31, 0, 6.29); cx.stroke(); cx.restore();
  const f = 1 - inv(13.5, 13.9, t); if (t > 13.5 && f > 0) { cx.fillStyle = `rgba(255,255,255,${f})`; cx.fillRect(0, 0, SC.w, SC.h); }
}
const ASSIGN = [[17.2, 0, "A"], [17.7, 1, "B"], [18.2, 2, "C"], [18.7, 3, "D"], [19.4, 4, "A"], [19.65, 4, "B"], [19.9, 4, "C"], [20.15, 4, "D"], [20.9, 5, "A"], [21.3, 5, "C"]];
const TRAY = { A: 72, B: 158, C: 244, D: 330 }, ROW0 = 168, ROWH = 74;
function scrList(t) {
  cx.fillStyle = "#fff"; cx.fillRect(0, 0, SC.w, SC.h); statusBar();
  txt("Nori Kitchen", 28, 112, 30, 800); txt("6 items · $121.90 with tip", 28, 142, 17, 500, C.sub);
  ITEMS.forEach(([name, v], i) => {
    const k = ui(t, 14.0 + i * 0.12, 0.35); if (k <= 0) return;
    const y = ROW0 + i * ROWH + (1 - k) * 260, x = 18 + (1 - k) * 40;
    cx.save(); cx.globalAlpha = k; rr(x, y, SC.w - 36, ROWH - 12, 16, "#f7f5ff");
    txt(name, x + 18, y + 38, 20, 600); txt(money(v), x + SC.w - 36 - 18, y + 38, 20, 700, C.ink, "right");
    const on = ASSIGN.filter((a) => a[1] === i && t >= a[0] + 0.3);
    on.forEach((a, j) => avatar(x + 150 + j * 30, y + 31, 13, a[2], pop(t, a[0] + 0.3, 0.3)));
    cx.restore();
  });
  // tray
  const tk = ui(t, 16.2, 0.35); cx.save(); cx.globalAlpha = tk; cx.translate(0, (1 - tk) * 120);
  rr(14, SC.h - 150, SC.w - 28, 120, 24, "#f2efff"); txt("Who had what?", 34, SC.h - 112, 16, 600, C.sub);
  for (const id in TRAY) avatar(TRAY[id], SC.h - 66, 28, id);
  cx.restore();
  // dragging avatars + tap ripple
  for (const [t0, i, id] of ASSIGN) {
    const k = ui(t, t0, 0.32); if (t < t0 || t > t0 + 0.45) continue;
    const x0 = TRAY[id], y0 = SC.h - 66, x1 = 168, y1 = ROW0 + i * ROWH + 31;
    avatar(lerp(x0, x1, k), lerp(y0, y1, k) - Math.sin(Math.PI * k) * 40, 24, id, 1.1);
    const r = inv(t0 + 0.3, t0 + 0.45, t); if (r > 0) { cx.strokeStyle = `rgba(108,76,255,${1 - r})`; cx.lineWidth = 3; cx.beginPath(); cx.arc(x1, y1, 20 + r * 30, 0, 6.29); cx.stroke(); }
  }
}
const ROWS = ["A", "B", "C", "D"];
function scrSplit(t, paidMode = false) {
  cx.fillStyle = "#fff"; cx.fillRect(0, 0, SC.w, SC.h); statusBar();
  txt(paidMode ? "Payments" : "Split", 28, 112, 30, 800); txt("Nori Kitchen · $121.90", 28, 142, 17, 500, C.sub);
  ROWS.forEach((id, i) => {
    const t0 = 24.5 + i * 0.2, k = ui(t, t0, 0.35); const y = 176 + i * 104 + (1 - k) * 60;
    cx.save(); cx.globalAlpha = k; rr(18, y, SC.w - 36, 88, 20, "#f7f5ff"); avatar(64, y + 44, 26, id);
    txt(P[id].n, 104, y + 40, 21, 700); txt(paidMode ? "Link sent" : "Items + tip", 104, y + 64, 15, 500, C.sub);
    const cnt = eout(inv(t0 + 0.2, t0 + 1.3, t)), v = TOT[id] * cnt;
    txt(money(v), SC.w - 40, y + 52, 24, 800, C.ink, "right");
    if (paidMode) { const pk = pop(t, 37.4 + i * 0.6, 0.35); if (pk > 0) { cx.save(); cx.translate(SC.w - 172, y + 46); cx.scale(pk, pk); rr(-40, -16, 80, 32, 16, C.ok); txt("Paid ✓", 0, 6, 15, 700, "#fff", "center"); cx.restore(); } }
    cx.restore();
  });
  const tk = ui(t, 25.6, 0.35); cx.save(); cx.globalAlpha = tk;
  rr(18, 600, SC.w - 36, 64, 18, "#f2efff"); txt("Tip 15%, split fairly", 38, 640, 18, 600, C.ink);
  const tg = ui(t, 26.6, 0.3); rr(SC.w - 92, 616, 56, 32, 16, tg > 0.5 ? C.brand : "#d9d3f2"); cx.beginPath(); cx.arc(lerp(SC.w - 76, SC.w - 52, tg), 632, 12, 0, 6.29); cx.fillStyle = "#fff"; cx.fill(); cx.restore();
  if (!paidMode) { const bk = ui(t, 31.5, 0.35); cx.save(); cx.globalAlpha = bk; rr(18, SC.h - 112, SC.w - 36, 70, 22, C.brand); txt("Send links", SC.w / 2, SC.h - 68, 22, 700, "#fff", "center"); cx.restore(); }
  else {
    const done = ROWS.filter((_, i) => t >= 37.4 + i * 0.6 + 0.2).length, pk = eout(inv(37.4, 39.6, t));
    rr(18, SC.h - 112, SC.w - 36, 70, 22, "#f2efff"); rr(18, SC.h - 112, (SC.w - 36) * pk, 70, 22, done === 4 ? C.ok : C.brand2);
    txt(`${done} of 4 paid`, SC.w / 2, SC.h - 68, 22, 700, done === 4 ? "#fff" : C.ink, "center");
  }
}
function scrPaid(t) {
  scrSplit(t, true);
  ROWS.forEach((id, i) => { // notification banners drop in from the top
    const t0 = 34.6 + i * 0.45, k = ui(t, t0, 0.35), o = ui(t, t0 + 1.2, 0.3); if (k <= 0 || o >= 1) return;
    const y = 18 + (1 - k) * -120 + i * 0 - o * 140;
    cx.save(); cx.globalAlpha = 1 - o; shadow(24, 8, 0.18); rr(14, y, SC.w - 28, 78, 20, "rgba(255,255,255,0.97)"); noShadow();
    logo(46, y + 39, 14, 1, false); txt("Splitly", 72, y + 32, 15, 700); txt(`${P[id].n}, you owe ${money(TOT[id])} · Pay`, 72, y + 56, 16, 500, C.sub); cx.restore();
  });
}
// ---------- donut that forms, then splits apart
function donut(t, x, y, r) {
  const total = Object.values(TOT).reduce((a, b) => a + b, 0); let a0 = -Math.PI / 2;
  const form = eio(inv(27.6, 28.8, t)), split = eio(inv(29.4, 30.0, t));
  ROWS.forEach((id) => {
    const sweep = (TOT[id] / total) * Math.PI * 2, a1 = a0 + sweep * 1, mid = a0 + sweep / 2, off = 26 * split;
    const end = lerp(-Math.PI / 2, a1, form); if (end > a0) {
      cx.save(); cx.translate(Math.cos(mid) * off, Math.sin(mid) * off);
      cx.beginPath(); cx.arc(x, y, r, a0, Math.min(end, a1)); cx.arc(x, y, r * 0.58, Math.min(end, a1), a0, true); cx.closePath(); cx.fillStyle = P[id].c; cx.fill();
      if (split > 0.6) { const lx = x + Math.cos(mid) * (r + 54), ly = y + Math.sin(mid) * (r + 54); cx.globalAlpha = inv(0.6, 1, split); txt(money(TOT[id]), lx, ly + 8, 24, 800, C.ink, "center"); }
      cx.restore();
    }
    a0 += sweep;
  });
  if (form > 0.9) { cx.globalAlpha = inv(0.9, 1, form) * (1 - split * 0.0); txt("$121.90", x, y + 10, 30, 800, C.ink, "center"); cx.globalAlpha = 1; }
}

// ================ SHOTS ================
function s1(t) { // 0–6 receipt unrolls, numbers scramble, friends point at each other
  bgDots(t);
  const un = eout(inv(0.2, 1.4, t)), sq = eio(inv(5.6, 6.0, t));
  cx.save(); cx.translate(1260, 140); cx.scale(1, 1 - 0.7 * sq); receipt(-210, 0, 420, 700, t, t > 1.6 ? 1 : 0, un); cx.restore();
  const F = [["A", 880, 330], ["B", 1640, 300], ["C", 900, 800], ["D", 1640, 820]];
  F.forEach(([id, x, y], i) => {
    const k = pop(t, 1.8 + i * 0.15, 0.4); const wob = Math.sin(t * 9 + i) * 4 * k;
    avatar(x, y + wob, 58, id, k);
    if (t > 2.6) { // pointing at the next friend + question bubble
      const [, tx, ty] = F[(i + 1) % 4], ang = Math.atan2(ty - y, tx - x), pk = ui(t, 2.6 + i * 0.12, 0.3);
      cx.save(); cx.translate(x + Math.cos(ang) * 80, y + Math.sin(ang) * 80); cx.rotate(ang); cx.globalAlpha = pk;
      cx.fillStyle = P[id].c; rr(0, -9, 46 + Math.sin(t * 14 + i) * 8, 18, 9, P[id].c); cx.beginPath(); cx.moveTo(56 + Math.sin(t * 14 + i) * 8, 0); cx.lineTo(38, -18); cx.lineTo(38, 18); cx.fill(); cx.restore();
      const bk = pop(t, 3.0 + i * 0.2, 0.35); if (bk > 0) { cx.save(); cx.translate(x + (i % 2 ? 50 : -50), y - 80); cx.scale(bk, bk); rr(-26, -30, 52, 50, 18, "#fff"); txt("?", 0, 8, 32, 800, C.brand, "center"); cx.restore(); }
    }
  });
  caption(["Dinner was great."], t, 0.4, 2.9, 150, 470);
  caption(["Splitting the bill?", "Not so much."], t, 2.9, 6.0, 150, 430);
}
function s2(t) { // 6–12 receipt folds into a phone; logo pops on
  bgDots(t);
  const k = inv(6.0, 6.7, t), grow = back(inv(6.25, 6.75, t));
  phone(t, lerp(0.95, 1, grow), lerp(0.3, 1, grow), scrLogo, { s: 1 });
  caption(["Meet Splitly*."], t, 7.1, 12.0, 150, 520, 104);
}
function s3(t) { // 12–24 snap the receipt, tap who had what
  bgDots(t);
  const scr = t < 13.9 ? scrCamera : scrList;
  phone(t, 1, 1, scr, { rot: Math.sin(t * 0.5) * 0.01 });
  caption(["Snap the receipt."], t, 12.3, 16.8, 150, 500);
  caption(["Tap who had what."], t, 16.9, 24.0, 150, 500);
}
function s4(t) { // 24–34 totals count up, pie forms and splits
  bgDots(t);
  phone(t, 1, 1, (tt) => scrSplit(tt, false), { dx: 120 * ui(t, 24.0, 0.4) });
  caption(["Splitly* does the maths,", "tips included."], t, 24.3, 34.0, 150, 300, 76);
  donut(t, 470, 700, 170);
}
function s5(t) { // 34–42 links go out, everyone pays
  bgDots(t);
  phone(t, 1, 1, scrPaid, { dx: 120 });
  caption(["Everyone gets a link."], t, 34.3, 38.2, 150, 480, 80);
  caption(["Everyone pays*."], t, 38.3, 42.0, 150, 480, 80);
}
function s6(t) { // 42–50 UI zooms out to the logo
  bgDots(t);
  const k = eio(inv(42.0, 43.0, t));
  if (k < 1) phone(t, 1, 1, scrPaid.bind(null), { dx: 120 * (1 - k), s: lerp(1, 0.2, k), dy: -40 * k });
  const lk = pop(t, 42.7, 0.5);
  logo(W / 2 - 230, 470, 82, lk, true, 120);
  const tk = ui(t, 43.6, 0.4); cx.save(); cx.globalAlpha = tk; txt("Friends first, maths second.", W / 2, 640 + (1 - tk) * 20, 44, 600, C.sub, "center"); cx.restore();
  // store badges as plain placeholder shapes
  [[-180, "Download for iPhone"], [180, "Download for Android"]].forEach(([dx, s], i) => {
    const bk = pop(t, 44.4 + i * 0.12, 0.4); if (bk <= 0) return; cx.save(); cx.translate(W / 2 + dx, 760); cx.scale(bk, bk);
    rr(-160, -38, 320, 76, 20, C.ink); rr(-136, -18, 36, 36, 9, "#3a3557"); txt(s, -84, 9, 20, 600, "#fff"); cx.restore();
  });
  const out = inv(49.5, 50, t); if (out > 0) { cx.fillStyle = `rgba(244,241,255,${out})`; cx.fillRect(0, 0, W, H); }
}
// the last 0.2 s of a shot flows into the next with a quick slide (UI-style)
function scene(t) { if (t < 6) s1(t); else if (t < 12) s2(t); else if (t < 24) s3(t); else if (t < 34) s4(t); else if (t < 42) s5(t); else s6(t); }
window.render = (frame) => {
  if (cx.reset) cx.reset(); const t = frame / FPS; scene(t);
};
window.ready = document.fonts.ready.then(() => Promise.all([document.fonts.load("800 40px Inter"), document.fonts.load("500 40px Inter")]));
</script></body></html>
