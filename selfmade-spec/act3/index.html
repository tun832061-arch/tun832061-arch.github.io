<!doctype html>
<html><head><meta charset="utf-8">
<title>SELF MADE Trendz — Act 3</title>
<style>
@font-face{font-family:'BX';src:url(fonts/barlow-latin-700-italic.woff2) format('woff2');font-weight:700;font-style:italic}
@font-face{font-family:'BX';src:url(fonts/barlow-latin-800-italic.woff2) format('woff2');font-weight:800;font-style:italic}
@font-face{font-family:'BX';src:url(fonts/barlow-latin-600-normal.woff2) format('woff2');font-weight:600;font-style:normal}
@font-face{font-family:'BX';src:url(fonts/barlow-latin-500-normal.woff2) format('woff2');font-weight:500;font-style:normal}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Inter,sans-serif;color:#fff}
.a{position:absolute;left:0;top:0}
#persp{position:absolute;inset:0;perspective:1800px;perspective-origin:540px 900px}
#tilt,#ring{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-style:preserve-3d}
.card{position:absolute;left:270px;top:420px;width:540px;height:960px;border-radius:44px;overflow:hidden;box-sizing:border-box;backface-visibility:hidden;background:#111}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .edge{position:absolute;inset:0;border-radius:inherit;border:1.5px solid rgba(255,255,255,.28);background:linear-gradient(115deg,rgba(255,255,255,.10),rgba(255,255,255,0) 42%)}
#labels{position:absolute;left:0;top:1450px;width:1080px;height:130px;overflow:hidden}
.lab{position:absolute;left:0;width:1080px;text-align:center;font:800 italic 104px/1.15 BX;letter-spacing:.01em}
.idx{position:absolute;left:0;top:1392px;width:1080px;text-align:center;font:500 26px Inter;letter-spacing:.3em;color:#8e8e93}
.wd{display:inline-block;margin-right:.2em}
.pill{border-radius:999px;box-sizing:border-box;overflow:hidden}
</style></head>
<body><div id="stage"></div>
<script src="data.js"></script>
<script>
const LOGO=window.LOGO, TIM=window.TIM3;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), lerp=(a,b,p)=>a+(b-a)*p, prog=(t,a,b)=>clamp((t-a)/(b-a));
const E={outExpo:p=>p>=1?1:1-Math.pow(2,-10*p),inExpo:p=>p<=0?0:Math.pow(2,10*p-10),
 inOutExpo:p=>p<=0?0:p>=1?1:p<.5?Math.pow(2,20*p-10)/2:(2-Math.pow(2,-20*p+10))/2,
 outBack:(p,s=1.5)=>{const c=s+1;return 1+c*Math.pow(p-1,3)+s*Math.pow(p-1,2)},
 inOutCubic:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,outCubic:p=>1-Math.pow(1-p,3),inOutSine:p=>-(Math.cos(Math.PI*p)-1)/2};
const P=(t,a,b,e='outExpo')=>E[e](prog(t,a,b));
const stage=document.getElementById('stage');
function el(tag,cls,parent,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e}
const NS='http://www.w3.org/2000/svg';
function sv(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e}
function box(e,cx,cy,w,h,extra=''){e.style.width=w+'px';e.style.height=h+'px';e.style.transform=`translate(${cx-w/2}px,${cy-h/2}px) ${extra}`}

/* ===== CAROUSEL ===== */
const CARDS=[['black','BLACK','img/friend_placeholder.jpg'],['cream','CREAM'],['grey','GREY'],['burgundy','BURGUNDY'],['purple','PURPLE'],['hem','THE HEM'],['denim','THE DENIM']];
const R=640, N=CARDS.length, STEP=360/N;
const persp=el('div','',stage); persp.id='persp';
const tilt=el('div','',persp); tilt.id='tilt';
const ring=el('div','',tilt); ring.id='ring';
const cards=CARDS.map(([k,l,src])=>{const c=el('div','card',ring);const im=el('img','',c);im.src=src||`img/card_${k}.jpg`;el('div','edge',c);return {c,im,l}});
const labels=el('div','',stage); labels.id='labels';
const labs=CARDS.map(([k,l])=>el('div','lab',labels,l));
const idx=el('div','idx',stage,'');

/* ===== CTA ===== */
const cream=el('div','a',stage); cream.style.borderRadius='50%'; cream.style.background='#EDE4D3';
const rings=[0,1,2,3,4].map(()=>{const r=el('div','a',stage);r.style.borderRadius='50%';r.style.border='2px solid rgba(122,31,43,.16)';r.style.boxSizing='border-box';return r});
const ctaA=el('div','a',stage); ctaA.style.width='1080px'; ctaA.style.textAlign='center';
const ctaB=el('div','a',stage); ctaB.style.width='1080px'; ctaB.style.textAlign='center';
function words(parent,list,style){const line=el('div','',parent);Object.assign(line.style,style);return list.map(w=>({el:el('span','wd',line,w[0]),t:w[1]}))}
const A1=words(ctaA,[['Wetin',TIM.cta[0]],['you',TIM.cta[1]],['dey',TIM.cta[2]]],{font:'800 italic 128px/1.05 BX',color:'#0b0b0b'});
const A2=words(ctaA,[['wait',TIM.cta[3]],['for?',TIM.cta[4]]],{font:'800 italic 128px/1.05 BX',color:'#0b0b0b'});
const B1=words(ctaB,[['GO',TIM.cta[5]],['GET',TIM.cta[6]],['YOUR',TIM.cta[7]],['OWN',TIM.cta[8]]],{font:'800 italic 92px/1 BX',color:'#0b0b0b',letterSpacing:'.02em'});
const B2=words(ctaB,[['NOW.',TIM.cta[9]]],{font:'800 italic 330px/1 BX',color:'#7A1F2B',marginTop:'6px'});

/* ===== CALL PILL (shared by CTA + end) ===== */
const pill=el('div','a pill',stage);
pill.style.background='linear-gradient(180deg,#1e1e20,#0f0f10)'; pill.style.border='1.5px solid rgba(255,255,255,.12)';
const pAv=el('div','a',pill,'C'); Object.assign(pAv.style,{width:'64px',height:'64px',borderRadius:'50%',background:'linear-gradient(145deg,#3b3b40,#1b1b1e)',display:'flex',alignItems:'center',justifyContent:'center',font:'800 italic 32px BX'});
const pTxt=el('div','a',pill,'Collins'); pTxt.style.font='600 34px Inter';
const pTim=el('div','a',pill,'00:31'); pTim.style.font='500 32px Inter'; pTim.style.fontVariantNumeric='tabular-nums'; pTim.style.color='#c7c7cc';
const pBars=[...Array(14)].map(()=>{const b=el('div','a',pill);b.style.background='#fff';b.style.borderRadius='3px';return b});

/* ===== END CARD ===== */
const svg=sv('svg',{width:1080,height:1920,viewBox:'0 0 1080 1920',class:'a'},stage);
const defs=sv('defs',{},svg);
const mask=sv('mask',{id:'knock',maskUnits:'userSpaceOnUse',x:-500,y:-500,width:5200,height:2400},defs);
sv('rect',{x:-500,y:-500,width:5200,height:2400,fill:'#fff'},mask);
sv('path',{d:LOGO.center,fill:'none',stroke:'#000','stroke-width':LOGO.gap,'stroke-linecap':'round'},mask);
sv('path',{d:LOGO.swash,fill:'#000',stroke:'#000','stroke-width':LOGO.gap-LOGO.stem+20},mask);
const cp=sv('clipPath',{id:'wipe'},defs); const wipeR=sv('rect',{x:-300,y:-400,width:0,height:2400},cp);
const logoOuter=sv('g',{},svg); const logoSk=sv('g',{transform:`skewX(${-LOGO.skew})`},logoOuter);
const sG=sv('g',{'clip-path':'url(#wipe)',fill:'#fff'},logoSk); const sWord=sv('g',{mask:'url(#knock)'},sG);
LOGO.glyphs.forEach(d=>sv('path',{d},sWord)); const swashP=sv('path',{d:LOGO.swash},sG);
const tG=sv('g',{fill:'#fff'},logoSk); const tGl=LOGO.trendz.map(d=>sv('path',{d},tG));
const tag=el('div','a',stage,'WEAR YOUR IDENTITY.'); Object.assign(tag.style,{width:'1080px',textAlign:'center',font:'600 34px BX',color:'#bdbdbd'});
const rule=el('div','a',stage); rule.style.height='2px'; rule.style.background='rgba(255,255,255,.35)';
const drop=el('div','a',stage,'THE NEW SETS — OUT NOW'); Object.assign(drop.style,{width:'1080px',textAlign:'center',font:'700 italic 50px BX',letterSpacing:'.04em'});
const url=el('div','a',stage,''); Object.assign(url.style,{width:'1080px',textAlign:'center',font:'500 38px Inter',color:'#9a9aa0'});
const URL='selfmadetrendz.store';
let LC=[0,0],LW=1;
function init(){const bb=logoSk.getBBox();LC=[bb.x+bb.width/2,bb.y+bb.height/2];LW=bb.width}

function render(t){
 const T=TIM;
 /* ---------- CAROUSEL ---------- */
 const ent=E.inOutExpo(prog(t,0.0,0.6));                 // full-frame -> card
 const exp=E.inOutExpo(prog(t,T.expand,T.expand+0.55));   // card -> full-frame
 const spin=E.inOutCubic(prog(t,0.45,T.expand-0.05));
 const th=-360*spin;
 const tl=P(t,0.35,1.0,'inOutCubic')*(1-P(t,T.expand-0.45,T.expand,'inOutCubic'));
 tilt.style.transform=`translateY(${-60*tl}px) rotateZ(${-9*tl}deg) rotateX(${6*tl}deg)`;
 ring.style.transform=`translateZ(${-R}px)`;
 const showCar=t<T.cta0+0.6;
 persp.style.opacity=showCar?1:0;
 cards.forEach((o,i)=>{
  const a=i*STEP+th; const ca=Math.cos(a*Math.PI/180);
  let s=1, rad=44, op=1, br=0.32+0.68*Math.pow((ca+1)/2,1.4);
  if(i===0){s=lerp(2,1,ent)*lerp(1,2,exp); rad=lerp(0,44,ent)*(1-exp); br=lerp(br,1,Math.max(1-ent,exp))}
  else op=P(t,0.3+0.05*i,0.75+0.05*i,'outCubic')*(1-P(t,T.expand-0.1,T.expand+0.25,'outCubic'));
  o.c.style.transform=`rotateY(${a}deg) translateZ(${R}px) scale(${s})`;
  o.c.style.borderRadius=rad+'px'; o.c.style.opacity=op*(ca<-0.15?0:1); o.c.style.filter=`brightness(${br})`;
  o.c.querySelector('.edge').style.opacity=(i===0)?(1-Math.max(1-ent,exp)):1;
  if(i===0){const push=1+0.07*prog(t,T.expand,T.cta0); o.im.style.transform=`scale(${push})`}
 });
 // labels roll with the front card
 const lv=P(t,0.5,0.9)*(1-P(t,T.expand-0.25,T.expand));
 labs.forEach((l,i)=>{let a=((i*STEP+th)%360+540)%360-180; l.style.transform=`translateY(${a*2.4}px)`; l.style.opacity=lv*clamp(1-Math.abs(a)/34)});
 {let best=0,bd=999;cards.forEach((o,i)=>{let a=Math.abs(((i*STEP+th)%360+540)%360-180);if(a<bd){bd=a;best=i}});
  idx.textContent=String(best+1).padStart(2,'0')+'  /  '+String(N).padStart(2,'0'); idx.style.opacity=lv}

 /* ---------- CTA ---------- */
 const c0=T.cta0;
 // pill: drops in for CTA, stays through end
 const pin=E.outBack(prog(t,c0-0.1,c0+0.3),1.4);
 const endS=T.end0;
 const toEnd=E.inOutExpo(prog(t,endS+1.05,endS+1.6));       // pill -> centre line
 let pw=lerp(520,600,P(t,endS+0.35,endS+0.6)), ph=110, py=lerp(-80,230,pin);
 pw=lerp(pw,880,toEnd); ph=lerp(ph,6,toEnd); py=lerp(py,880,toEnd);
 const pillOn=t>=c0-0.1 && t<endS+1.75;
 pill.style.opacity=pillOn?(1-P(t,endS+1.5,endS+1.75)):0;
 const wh=P(t,endS+0.95,endS+1.3,'inOutCubic');
 pill.style.background=wh>0?`rgb(${Math.round(lerp(22,255,wh))},${Math.round(lerp(22,255,wh))},${Math.round(lerp(24,255,wh))})`:'linear-gradient(180deg,#1e1e20,#0f0f10)';
 box(pill,540,py,pw,ph);
 const inner=1-P(t,endS+0.95,endS+1.1);
 pAv.style.transform=`translate(24px,${(ph-64)/2}px)`; pAv.style.opacity=inner;
 const ended=t>=endS+0.35;
 pTxt.textContent=ended?'Call ended':'Collins'; pTxt.style.color=ended?'#ff6b6b':'#fff';
 pTxt.style.transform=`translate(108px,${ph/2-21}px)`; pTxt.style.opacity=inner*(ended?P(t,endS+0.35,endS+0.5):1);
 pTim.textContent=T.callLen; pTim.style.transform=`translate(${pw-32-pTim.offsetWidth}px,${ph/2-19}px)`; pTim.style.opacity=inner*(ended?1:0);
 const va=t<endS?voice(t):0;
 pBars.forEach((b,i)=>{const n=0.35+0.65*Math.abs(Math.sin(i*1.7+t*19)*Math.cos(i*.6-t*11));const h=4+va*44*n;
   b.style.width='5px';b.style.height=h+'px';b.style.transform=`translate(${pw-40-14*9+i*9}px,${ph/2-h/2}px)`;b.style.opacity=inner*(ended?0:1)});
 // cream flood from the pill, collapsing back at the end
 const fl=E.inOutExpo(prog(t,c0+0.05,c0+0.6)), un=E.inOutExpo(prog(t,endS,endS+0.45));
 const cr=2300*fl*(1-un);
 cream.style.opacity=cr>1?1:0; box(cream,540,lerp(230,230,0),cr*2,cr*2);
 // ambient rings (callback to the incoming-call rings)
 rings.forEach((r,i)=>{const per=1.1;const ph2=((t-c0-0.4)/per+i/rings.length);const p=ph2-Math.floor(ph2);const on=t>c0+0.4&&t<endS;
  const d=200+1400*p; box(r,540,960,d,d); r.style.opacity=on?(1-p)*P(t,c0+0.4,c0+0.9)*(1-un):0});
 // words
 const pop=(o,big)=>{const p=prog(t,o.t,o.t+0.3);o.el.style.opacity=P(t,o.t,o.t+0.12);o.el.style.transform=`translateY(${30*(1-E.outExpo(p))}px) scale(${lerp(big?1.25:.9,1,big?E.outBack(p,2):E.outExpo(p))})`};
 [...A1,...A2].forEach(o=>pop(o)); [...B1].forEach(o=>pop(o)); B2.forEach(o=>pop(o,true));
 const swap=T.cta[5]-0.12;
 const sq=P(t,swap-0.12,swap,'inExpo');
 ctaA.style.transform=`translateY(${800}px) translateY(${-110*sq}px) scaleY(${1-0.97*sq})`; ctaA.style.transformOrigin='540px 140px';
 ctaA.style.opacity=(t<swap+0.02&&t>c0)?1:0;
 ctaB.style.transform=`translateY(760px)`; ctaB.style.opacity=(t>=swap&&t<endS+0.3)?(1-P(t,endS,endS+0.3)):0;

 /* ---------- END CARD ---------- */
 const L0=endS+1.45;
 const wp=E.inOutExpo(prog(t,L0,L0+0.45)); wipeR.setAttribute('width',4600*wp);
 const lw=820*(t>=L0+0.45?1+0.03*(1-E.outExpo(prog(t,L0+0.45,L0+0.9))):1), s=lw/LW;
 logoOuter.setAttribute('transform',`translate(540 870) scale(${s}) translate(${-LC[0]} ${-LC[1]})`);
 logoOuter.style.opacity=t>=L0?1:0;
 tGl.forEach((p,k)=>{const tp=E.outExpo(prog(t,L0+0.25+0.03*k,L0+0.75+0.03*k));p.setAttribute('transform',`translate(${(k-2.5)*140*(1-tp)} 0)`);p.style.opacity=tp});
 const tg=prog(t,L0+0.7,L0+1.4);
 tag.style.opacity=P(t,L0+0.7,L0+1.0); tag.style.letterSpacing=lerp(.62,.42,E.outExpo(tg))+'em'; tag.style.transform='translateY(1085px)';
 const rl=E.inOutExpo(prog(t,L0+1.0,L0+1.4)); rule.style.width=(320*rl)+'px'; rule.style.transform=`translate(${540-160*rl}px,1175px)`;
 drop.style.opacity=P(t,L0+1.2,L0+1.45); drop.style.transform=`translateY(${1215+24*(1-P(t,L0+1.2,L0+1.6))}px)`;
 const nch=Math.floor(URL.length*prog(t,L0+1.55,L0+2.25)); const caret=(t>L0+1.5 && Math.floor(t*2.4)%2===0)?'|':' ';
 url.textContent=URL.slice(0,nch)+(t>L0+1.5?caret:''); url.style.transform='translateY(1300px)';
}
function voice(t){let a=0;for(const w of TIM.ctaW){const p=(t-w[0])/(w[1]+0.08);if(p>-0.1&&p<1.1){a=Math.max(a,Math.pow(Math.sin(Math.PI*clamp((p+0.1)/1.2)),0.7))}}return a*(0.62+0.38*Math.abs(Math.sin(t*2*Math.PI*4.1)))}
window.render=render; window.init=init;
</script></body></html>
